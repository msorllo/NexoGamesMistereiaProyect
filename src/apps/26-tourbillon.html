<!doctype html>
<html lang="es" data-app="tourbillon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tourbillon</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f14;--bg2:#1b2230;--fg:#eef1f5;--acc:#3d6bff;--acc2:#7d9bff;--gold:#d6b36a;--ruby:#e0224f;--mut:#8a93a3;--glass:rgba(12,15,21,.66);--line:rgba(238,241,245,.11)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Sora',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#c.pt{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
.disp{font-family:'Michroma',Eurostile,'Arial Narrow',sans-serif;letter-spacing:.14em;text-transform:uppercase}
/* intro de UI escalonada */
.in{opacity:0;transform:translateY(10px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
.ready .in{opacity:1;transform:none}
.ready .d1{transition-delay:.15s}.ready .d2{transition-delay:.3s}.ready .d3{transition-delay:.45s}.ready .d4{transition-delay:.6s}
/* barra superior */
.top{position:fixed;left:0;right:0;top:0;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.brand{pointer-events:auto}
.logo{font-size:22px;line-height:1;display:flex;align-items:center;gap:10px}
.logo svg{width:26px;height:26px;color:var(--gold)}
.cal{display:flex;align-items:center;gap:6px;margin-top:12px}
.cal button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:rgba(255,255,255,.03);transition:background .2s,transform .2s}
.cal button:hover{background:rgba(255,255,255,.1)}.cal button:active{transform:scale(.92)}
.cal button:disabled{opacity:.25;cursor:not-allowed}
.cal svg{width:14px;height:14px}
.cal .nm{min-width:132px;text-align:center}
.cal .nm b{display:block;font-family:'Michroma',sans-serif;font-weight:400;font-size:13px;letter-spacing:.12em}
.cal .nm small{display:block;font-size:11px;color:var(--mut);letter-spacing:.08em;margin-top:3px}
.cal .st{color:var(--gold);font-size:11px;letter-spacing:2px;min-height:12px}
.tr{display:flex;gap:8px;pointer-events:auto;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{height:42px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;transition:background .2s,transform .2s,border-color .2s}
.chip:hover{background:rgba(255,255,255,.08)}.chip:active{transform:scale(.96)}
.chip svg{width:17px;height:17px}
.chip .g{color:var(--gold)}
.chip.day{border-color:rgba(61,107,255,.5)}
.chip.day .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.chip.day.done .dot{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.icon{width:42px;padding:0;justify-content:center}
/* mensaje de estado */
.msg{position:fixed;left:50%;top:22px;transform:translateX(-50%);max-width:min(460px,calc(100vw - 32px));text-align:center;font-size:13px;line-height:1.45;color:#cfd6e2;padding:10px 16px;border-radius:14px;pointer-events:none;transition:opacity .35s,transform .35s,border-color .3s,color .3s}
.msg.hide{opacity:0;transform:translate(-50%,-6px)}
.msg.bad{border-color:rgba(224,34,79,.55);color:#ffd5de}
.msg.good{border-color:rgba(214,179,106,.55);color:#f6e7c4}
.msg.warn{border-color:rgba(125,155,255,.55)}
/* base */
.dock{position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.stats{pointer-events:auto;padding:12px 16px;display:flex;gap:20px}
.stats div{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.stats b{display:block;font-family:'Michroma',sans-serif;font-weight:400;font-size:20px;color:var(--fg);letter-spacing:.04em;margin-top:6px;font-variant-numeric:tabular-nums}
.stats b.bad{color:var(--ruby)}
.tray{pointer-events:auto;padding:8px;display:flex;gap:6px;align-items:stretch}
.gear{position:relative;width:86px;border-radius:13px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;transition:background .2s,border-color .2s,transform .15s,opacity .2s}
.gear:hover{background:rgba(255,255,255,.06)}
.gear:active{transform:scale(.95)}
.gear.on{background:rgba(61,107,255,.16);border-color:rgba(61,107,255,.6)}
.gear.none{opacity:.35}
.gear svg{width:40px;height:40px;color:var(--gold);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.gear.on svg{transform:rotate(30deg);color:#f0cf86}
.gear .l{font-size:10px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.gear .n{position:absolute;top:5px;right:7px;font-family:'Michroma',sans-serif;font-size:11px;color:var(--fg)}
.gear .n.z{color:var(--mut)}
.sep{width:1px;background:var(--line);margin:6px 4px}
.tool{width:50px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;transition:background .2s,transform .15s}
.tool:hover{background:rgba(255,255,255,.06);color:var(--fg)}.tool:active{transform:scale(.94)}
.tool svg{width:20px;height:20px}
.tool:disabled{opacity:.3}
/* victoria */
.win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .5s;padding:16px;background:radial-gradient(circle at 50% 50%,rgba(12,15,20,.2),rgba(12,15,20,.65))}
.win.on{opacity:1;pointer-events:auto}
.card{width:min(380px,100%);padding:28px 26px 24px;text-align:center;border-radius:26px;border-color:rgba(214,179,106,.35);box-shadow:0 40px 120px -30px rgba(0,0,0,.8),0 0 0 1px rgba(214,179,106,.08) inset;transform:translateY(16px) scale(.97);transition:transform .6s cubic-bezier(.2,.9,.2,1.1)}
.win.on .card{transform:none}
.card .k{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.card h2{font-family:'Michroma',sans-serif;font-weight:400;font-size:22px;letter-spacing:.1em;margin:12px 0 4px;text-transform:uppercase}
.card .stars{display:flex;justify-content:center;gap:10px;margin:18px 0 8px}
.card .stars svg{width:34px;height:34px;color:rgba(255,255,255,.12);transform:scale(.3) rotate(-40deg);opacity:0;transition:transform .6s cubic-bezier(.2,.9,.3,1.5),opacity .4s,color .3s}
.card .stars svg.on{color:var(--gold);filter:drop-shadow(0 0 10px rgba(214,179,106,.6))}
.card .stars svg.show{transform:none;opacity:1}
.card p{font-size:13px;color:#c3cad6;line-height:1.5;margin:8px 0 0}
.card .watch{display:flex;align-items:center;gap:12px;text-align:left;margin:18px 0 4px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.card .watch .dl{width:44px;height:44px;flex:none}
.card .watch b{display:block;font-size:13px}.card .watch small{font-size:11px;color:var(--mut)}
.row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;height:46px;border-radius:13px;font-weight:600;font-size:14px;background:rgba(255,255,255,.08);transition:background .2s,transform .15s}
.btn:hover{background:rgba(255,255,255,.14)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:#fff;box-shadow:0 10px 30px -10px rgba(61,107,255,.8)}
.btn.pri:hover{background:#5a82ff}
/* vitrina */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);padding:20px 20px 24px;border-radius:26px 0 0 26px;border-right:0;transform:translateX(105%);transition:transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px;z-index:5}
.sheet.on{transform:none}
.sh-h{display:flex;justify-content:space-between;align-items:center}
.sh-h h3{margin:0;font-family:'Michroma',sans-serif;font-weight:400;font-size:15px;letter-spacing:.2em;text-transform:uppercase}
.sh-h button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.sh-h svg{width:16px;height:16px}
.comps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.comp{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12px}
.comp b{display:block;font-size:12px;margin-bottom:6px}
.comp .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.comp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.comp small{display:block;color:var(--mut);margin-top:6px;font-size:11px}
.comp.ok{border-color:rgba(214,179,106,.45)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow:auto;padding-right:4px;flex:1;align-content:start}
.w{position:relative;padding:12px 6px 10px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .2s,transform .2s,border-color .2s}
.w:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.w.sel{border-color:var(--acc)}
.w .dl{width:62px;height:62px}
.w b{font-size:11px;font-weight:600;text-align:center;line-height:1.25}
.w small{font-size:10px;color:var(--gold);letter-spacing:2px;min-height:12px}
.w.lock .dl{filter:grayscale(1) brightness(.35)}
.w.lock b{color:var(--mut)}
.w .lk{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:18px;height:18px;color:var(--mut)}
.sh-f{display:flex;gap:8px}
.sh-f .btn{height:44px}
/* cargando */
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 45%,#1b2230,#0c0f14 70%);z-index:50;transition:opacity .6s}
#load .disp{font-size:13px;color:#aab3c2}
#load svg{width:54px;height:54px;color:var(--gold);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:760px){
 .top{padding:12px 12px;flex-direction:column;align-items:stretch;gap:8px}
 .brand{display:flex;justify-content:space-between;align-items:center}
 .logo{font-size:15px}.logo svg{width:20px;height:20px}
 .cal{margin-top:0}.cal .nm{min-width:104px}.cal .nm b{font-size:11px}.cal button{width:32px;height:32px}
 .tr{justify-content:space-between;flex-wrap:nowrap}
 .chip{height:38px;padding:0 11px;font-size:12px}.icon{width:38px}
 .msg{top:auto;bottom:188px;font-size:12px}
 .dock{flex-direction:column;align-items:stretch;padding:10px 10px calc(10px + env(safe-area-inset-bottom));gap:8px}
 .stats{justify-content:space-around;padding:9px 12px}.stats b{font-size:16px;margin-top:4px}
 .tray{justify-content:space-between}.gear{flex:1;width:auto}.tool{width:46px}
 .sheet{top:auto;height:60vh;width:100vw;border-radius:26px 26px 0 0;border-bottom:0;border-right:1px solid var(--line);transform:translateY(105%)}
 .sheet.on{transform:none}
}
@media (max-width:380px){.gear svg{width:32px;height:32px}.chip .t{display:none}}
html.notr *{transition:none!important}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>

</svg>

<header class="top">
 <div class="brand in">
  <div class="logo disp"><svg viewBox="0 0 64 64" aria-hidden="true"><path class="gp" fill="currentColor"/></svg>Tourbillon</div>
  <div class="cal">
   <button id="prev" aria-label="Calibre anterior"><svg><use href="#i-l"/></svg></button>

/* ===== FX: kit premium compartido (copiado en cada app; mantener igual en todas) ===== */
const FX=(()=>{
 const F={t:0,dt:0,tweens:[],shakeA:0,reduced:matchMedia('(prefers-reduced-motion: reduce)').matches,hq:/[?&]hq/.test(location.search)};

 F.ease={out:t=>1-Math.pow(1-t,3),inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,back:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},elastic:t=>t===0||t===1?t:Math.pow(2,-10*t)*Math.sin((t*10-.75)*2*Math.PI/3)+1,lin:t=>t};
 F.b64=s=>{const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer};
 F.init=(o={})=>{
  const canvas=document.getElementById('c');
  const r=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
  r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=o.exposure??1;
  r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();scene.background=F.lin(o.bg||'#101010');

function homePose(){const asp=innerWidth/innerHeight;const mob=innerWidth<760;const vf=camera.fov*Math.PI/180;const hf=2*Math.atan(Math.tan(vf/2)*asp);const need=5.9/Math.tan(Math.min(vf,hf)/2)*(mob?1.02:1.08);const d=Math.max(12,Math.min(30,need));const pol=mob?.34:.62;return{pos:new THREE.Vector3(0,Math.cos(pol)*d,Math.sin(pol)*d),tgt:new THREE.Vector3(mob?0:.6,mob?-.2:0,mob?.6:.7)}}

 if(!LVL||!board)return;

 if(won){tickT+=dt;const f=2.5;const ph=TAU*f*tickT;volA=Math.sin(ph)*2.2;ancA=Math.tanh(Math.sin(ph)*5)*.12;
  const beat=tickT*2*f,k=Math.floor(beat),fr=beat-k;if(k!==objs.lastBeat){objs.lastBeat=k;if(k>0)sfx(k%2?'tock':'tick');if(k%2===0)FX.burst(P(LVL.anc.vp.u,LVL.anc.vp.v,.9),{count:2,color:'#ffe2b0',speed:.3,life:.6,gravity:.2})}
  const step=TAU/30*(k+Math.min(1,fr/.18)*1);const thE=escBase+LVL.dir*step;D=(thE-ev.coef.esc.b)/ev.coef.esc.a}
 else if(ev&&!ev.jam){D+=dt*(ev.connected?.25:.55)}

 const setG=(o,id)=>{if(!o)return;const c=ev&&ev.coef[id];if(c&&inComp.has(id))o.rotation.y=c.a*D+c.b+(jit?jit*(id.charCodeAt(1)%2?1:-1):0);else o.rotation.y=o.userData.phase||0};

}
