<!doctype html>
<html lang="es" data-app="quilate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quilate</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--pearl:#eceef1;--white:#fafbfc;--ink:#121316;--ink2:#4a4f58;--mut:#8a909a;--em:#0f5c4a;--em2:#1b7a63;--line:#d7dae0;--glass:rgba(250,251,252,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--pearl);color:var(--ink);font-family:'Jost',system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.bd{font-family:'Bodoni Moda',Didot,'Bodoni 72',Georgia,serif}
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.9);box-shadow:0 20px 60px -30px rgba(18,19,22,.35),0 0 0 1px rgba(18,19,22,.05);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
html.notr *{transition:none!important}
.in{opacity:0;transform:translateY(10px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1)}
.ready .in{opacity:1;transform:none}.ready .d1{transition-delay:.2s}.ready .d2{transition-delay:.4s}.ready .d3{transition-delay:.6s}
/* cabecera */
.brand{position:fixed;left:24px;top:22px}
.brand h1{margin:0;font-family:'Bodoni Moda',Didot,serif;font-weight:400;font-size:30px;letter-spacing:.34em;line-height:1}
.brand .lv{margin-top:8px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:10px}
.stars{color:var(--em);letter-spacing:2px;font-size:12px}
.modes{position:fixed;left:24px;top:94px;display:flex;padding:4px;border-radius:999px;gap:2px}
.modes button{height:36px;padding:0 16px;border-radius:999px;font-size:13px;letter-spacing:.06em;color:var(--ink2);transition:background .3s,color .3s}
.modes button.on{background:var(--ink);color:#fff}
.price{position:fixed;left:calc((100% - 384px) / 2 + 110px);top:22px;transform:translateX(-50%);text-align:center;pointer-events:none;max-width:calc(100% - 640px)}
.price small{display:block;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--mut)}
.price b{display:block;font-family:'Bodoni Moda',Didot,serif;font-weight:400;font-size:38px;letter-spacing:.02em;margin-top:4px;font-variant-numeric:lining-nums tabular-nums}
.price i{display:block;font-family:'Bodoni Moda',serif;font-size:14px;color:var(--ink2);margin-top:2px}
.price .bud{font-style:normal;font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.06em;margin-top:6px;padding:3px 10px;border-radius:999px;display:inline-block}
.bud.ok{background:rgba(15,92,74,.1);color:var(--em)}.bud.no{background:rgba(160,30,50,.1);color:#9c1f38}
.tb{position:fixed;right:24px;top:22px;display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .2s}
.ib:active{transform:scale(.92)}.ib svg{width:18px;height:18px}
/* cliente */
.client{position:fixed;left:24px;top:146px;width:300px;border-radius:22px;padding:18px;transform:translateX(-120%);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.client.on{transform:none}
.cl-h{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:'Bodoni Moda',serif;font-size:20px;color:#fff;flex:none}
.cl-h b{display:block;font-family:'Bodoni Moda',serif;font-weight:600;font-size:17px}
.cl-h small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.vip{display:inline-block;margin-left:6px;font-size:9px;letter-spacing:.2em;padding:2px 7px;border-radius:999px;background:var(--ink);color:#f5e2a8;vertical-align:2px}
.story{font-family:'Bodoni Moda',serif;font-style:italic;font-size:15px;line-height:1.5;margin:14px 0 12px;color:var(--ink2)}
.reqs{display:flex;flex-wrap:wrap;gap:6px}
.rq{font-size:12px;padding:5px 10px 5px 8px;border-radius:999px;border:1px solid var(--line);display:flex;gap:6px;align-items:center;transition:background .3s,border-color .3s,color .3s}
.rq i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;transition:all .3s}
.rq.ok{border-color:rgba(15,92,74,.4);background:rgba(15,92,74,.07);color:var(--em)}
.rq.ok i{background:var(--em);border-color:var(--em)}
.rq.ok i:after{content:'';width:5px;height:3px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(0,-1px)}
.cl-f{display:flex;gap:8px;margin-top:16px}
.btn{height:46px;border-radius:14px;padding:0 18px;font-weight:500;font-size:14px;letter-spacing:.06em;transition:transform .15s,background .3s,box-shadow .3s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ink);color:#fff;flex:1;box-shadow:0 12px 30px -12px rgba(18,19,22,.6)}
.btn.pri:hover{background:#2a2c31}
.btn.sec{background:rgba(18,19,22,.06)}
.btn.em{background:var(--em);color:#fff}
/* panel de configuración */
.panel{position:fixed;right:24px;top:84px;bottom:24px;width:360px;border-radius:26px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:0;padding:10px 6px 0;overflow-x:auto;scrollbar-width:none;flex:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:38px;padding:0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid transparent;transition:color .3s,border-color .3s}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.opts{flex:1;overflow:auto;padding:18px 18px 8px}
.opts h4{margin:0 0 4px;font-family:'Bodoni Moda',serif;font-weight:400;font-size:22px}
.opts p.sub{margin:0 0 16px;font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{position:relative;padding:14px 12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.55);text-align:left;display:flex;gap:12px;align-items:center;transition:border-color .25s,background .25s,transform .15s,box-shadow .25s}
.opt:hover{background:#fff;box-shadow:0 10px 24px -16px rgba(18,19,22,.4)}.opt:active{transform:scale(.97)}
.opt.on{border-color:var(--ink);background:#fff;box-shadow:0 0 0 1px var(--ink)}
.opt .sw{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 6px rgba(0,0,0,.18),inset 0 3px 5px rgba(255,255,255,.55),0 2px 6px rgba(0,0,0,.15)}
.opt svg.cut{width:34px;height:34px;flex:none;color:var(--ink)}
.opt b{display:block;font-weight:500;font-size:14px}
.opt small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.opt.lock{opacity:.5;cursor:not-allowed}
.opt .lk{position:absolute;top:8px;right:9px;width:12px;height:12px;color:var(--mut)}
.ctv{font-family:'Bodoni Moda',serif;font-size:56px;text-align:center;margin:12px 0 2px}
.ctv small{font-size:18px;color:var(--mut);margin-left:6px}
.mm{text-align:center;color:var(--mut);font-size:13px;margin-bottom:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--ink) var(--p,20%),var(--line) var(--p,20%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:grab}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.eng{width:100%;height:52px;border-radius:14px;border:1px solid var(--line);padding:0 16px;font-family:'Bodoni Moda',serif;font-style:italic;font-size:20px;background:#fff}
.pf{flex:none;padding:14px 18px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.pf .btn{flex:1}
/* resultado de encargo */
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none;opacity:0;transition:opacity .6s;background:rgba(236,238,241,.35);z-index:8}
.scr.on{opacity:1;pointer-events:auto}
.card{width:min(420px,100%);border-radius:28px;padding:30px 28px 24px;text-align:center;transform:translateY(20px);transition:transform .7s cubic-bezier(.2,.9,.2,1.1)}
.scr.on .card{transform:none}
.card .k{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--mut)}
.card .sat{font-family:'Bodoni Moda',serif;font-size:84px;line-height:1;margin:12px 0 0}
.card .sat small{font-size:24px;color:var(--mut)}
.bk{text-align:left;margin:18px 0 8px;display:grid;gap:6px}
.bk div{display:flex;justify-content:space-between;font-size:13px;padding:8px 12px;border-radius:10px;background:rgba(18,19,22,.04)}
.bk .y{color:var(--em)}.bk .n{color:#9c1f38}
.rev{font-family:'Bodoni Moda',serif;font-style:italic;font-size:16px;line-height:1.5;color:var(--ink2);margin:14px 4px 6px}
.gain{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--em);margin-top:6px}
.card .row{display:flex;gap:8px;margin-top:18px}.card .row .btn{flex:1}
/* vitrina */
.sheet{position:fixed;left:24px;bottom:24px;width:min(560px,calc(100vw - 440px));border-radius:24px;padding:16px;transform:translateY(130%);opacity:0;visibility:hidden;pointer-events:none;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s,visibility 0s .7s;z-index:6}
.sheet.on{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-h b{font-family:'Bodoni Moda',serif;font-weight:400;font-size:20px}
.sh-h small{color:var(--mut);font-size:12px;margin-left:8px}
.designs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.ds{flex:none;width:120px;padding:12px 10px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.6);text-align:left;transition:border-color .2s,transform .15s}
.ds:hover{border-color:var(--ink)}.ds:active{transform:scale(.97)}
.ds .g{display:flex;gap:4px;margin-bottom:8px}.ds .g i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 -2px 4px rgba(0,0,0,.2)}
.ds b{display:block;font-family:'Bodoni Moda',serif;font-weight:600;font-size:13px}
.ds small{font-size:11px;color:var(--mut)}
.ds.new{display:grid;place-items:center;text-align:center;border-style:dashed;color:var(--ink2);font-size:13px}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 45%,#fff,#e6e8ec 70%);z-index:50;transition:opacity .8s}
#load .bd{font-size:24px;letter-spacing:.4em}
#load svg{width:40px;height:40px;animation:sp 2.4s ease-in-out infinite}
@keyframes sp{50%{transform:rotate(180deg) scale(.85)}100%{transform:rotate(360deg)}}
@media (max-width:860px){
 .brand{left:14px;top:14px}.brand h1{font-size:20px}.brand .lv{font-size:9px;margin-top:5px}
 .modes{left:auto;right:14px;top:66px;padding:3px}.modes button{height:32px;padding:0 12px;font-size:12px}
 .tb{right:14px;top:14px}.ib{width:40px;height:40px}
 .price{top:auto;bottom:calc(45vh + 10px);left:14px;transform:none;text-align:left;max-width:none}.price b{font-size:30px}.price small{letter-spacing:.2em}
 .client{left:14px;right:14px;top:112px;width:auto;padding:12px 14px;border-radius:18px}.story{font-size:13px;margin:8px 0}.cl-h .av{width:36px;height:36px;font-size:16px}.cl-f{display:none}
 .client .reqs{gap:4px}.rq{font-size:11px;padding:3px 8px 3px 6px}
 .panel{left:0;right:0;bottom:0;top:auto;width:auto;height:45vh;border-radius:24px 24px 0 0}
 .opts{padding:12px 14px 6px}.opts h4{font-size:18px}.opts p.sub{margin-bottom:10px;font-size:12px}.opt{padding:10px}.opt .sw,.opt svg.cut{width:28px;height:28px}.ctv{font-size:40px;margin:4px 0}
 .pf{padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
 .sheet{left:10px;right:10px;width:auto;bottom:calc(45vh + 10px)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>

const FX=(()=>{

function setMode(m){$('mA').classList.toggle('on',m==='A');$('mE').classList.toggle('on',m==='E');$('client').classList.toggle('on',m==='E');$('bdel').hidden=m!=='E';$('bsave').hidden=m==='E'&&innerWidth<860;if(m==='E'){if(!order)newOrder()}else{order=null}updPrice()}
$('mA').onclick=()=>{setMode('A');FX.tone(900,.05,'sine',.03)};$('mE').onclick=()=>{setMode('E');FX.tone(900,.05,'sine',.03)};
/* vitrina de diseños */
function renderDesigns(){$('dcount').textContent=S.designs.length+' / 12';$('designs').innerHTML=S.designs.map((d,i)=>`<button class="ds" data-i="${i}"><div class="g"><i style="${sw(METALS[d.c.metal].c,1)}"></i><i style="${sw(d.c.gem==='Diamante'?'#dfe6ee':GEMS[d.c.gem].c)}"></i></div><b>${d.n}</b><small>${eur(d.p)}</small></button>`).join('')+(S.designs.length<12?'<div class="ds new">Guarda un diseño para verlo aquí</div>':'');
 $('designs').querySelectorAll('button.ds').forEach(b=>b.onclick=()=>{cfg=validCfg(S.designs[+b.dataset.i].c);build(cfg,'drop');renderOpts();afterChange();sfx('click')})}
$('bvit').onclick=()=>{renderDesigns();$('sheet').classList.toggle('on')};$('shx').onclick=()=>$('sheet').classList.remove('on');
$('bsave').onclick=()=>{if(S.designs.length>=12){toast('La vitrina está llena (12)');return}const n=[cn(cfg.cut),gn(cfg.gem)].join(' de ');S.designs.push({n:n.length>24?n.slice(0,24):n,c:{...cfg},p:price()});const t=today();if(S.saveDay!==t){S.saveDay=t;S.saves=0}S.saves++;save();if(S.saves<=3)OS.xp(5,'Diseño guardado en Quilate');if(S.designs.length>=12)OS.achieve('quilate_vitrina','Coleccionista','Doce diseños en tu vitrina');renderDesigns();$('sheet').classList.add('on');toast('Guardado en tu vitrina');sfx('click')};
$('bsnd').onclick=()=>{S.snd=!S.snd;FX.muted=!S.snd;save();$('bsnd').innerHTML='<svg><use href="#i-'+(S.snd?'snd':'mute')+'"/></svg>'};
/* sonido */
function sfx(k){switch(k){case 'click':FX.tone(1400,.05,'sine',.03);break;
 case 'metal':FX.tone(2637,.9,'sine',.04);FX.tone(3951,.6,'sine',.02,.02);FX.tone(1318,1.2,'sine',.02);break;
 case 'gem':FX.tone(2093,.5,'sine',.035);FX.tone(3136,.4,'sine',.02,.06);FX.noise(.05,.03,9000,3,0,'highpass');break;
 case 'win':[1047,1319,1568,2093,2637].forEach((f,i)=>FX.tone(f,1,'sine',.04,i*.08));break;
 case 'meh':FX.tone(392,.3,'triangle',.04);FX.tone(330,.4,'triangle',.04,.18);break}}

/* ---------- bucle ---------- */
let spT=0;function frame(dt,t){
 if(camTw&&camFrom){const k=camTw.k,[p0,t0,p1,t1]=camFrom;camera.position.lerpVectors(p0,p1,k);camera.position.y+=Math.sin(k*Math.PI)*.4;controls.target.lerpVectors(t0,t1,k)}
 controls.update();
 if(piece){turn+=dt*(FX.reduced?.1:.32);if(cfg.piece==='Anillo')piece.rotation.y=Math.sin(turn)*.9+turn*.0;else if(cfg.piece==='Colgante'){piece.children.forEach(ch=>{if(!ch.isInstancedMesh)ch.rotation.z=Math.sin(t*1.1)*.035})}else piece.children.forEach(e=>{e.rotation.z=Math.sin(t*1.4+e.userData.sw)*.05;e.rotation.y=Math.sin(t*.5+e.userData.sw)*.5})}
 // alejandrita: cambia de color según el ángulo a la luz
 if(cfg.gem==='Alejandrita'&&gemMats.Alejandrita){const k=(Math.sin(turn*2.2)+1)/2;const a=FX.lin(GEMS.Alejandrita.c),b=FX.lin(GEMS.Alejandrita.c2);gemMats.Alejandrita.color.copy(a).lerp(b,k);gemMats.Alejandrita.attenuationColor.copy(a).lerp(b,k)}
 spT-=dt;if(spT<0){spT=.08+Math.random()*.18;spark()}
 sparks.forEach(p=>{if(p.t>=1){p.s.visible=false;return}p.t+=dt/p.d;const k=Math.sin(Math.min(1,p.t)*Math.PI);p.s.material.opacity=k;p.s.scale.setScalar(p.sz*(.4+k));p.s.material.rotation+=dt*.8});
 key.position.set(-4+Math.sin(t*.1)*1.5,9,6)}

/* ---------- arranque ---------- */
FX.load(()=>{
 metalMat=new THREE.MeshPhysicalMaterial({color:FX.lin(METALS[cfg.metal].c),metalness:1,roughness:METALS[cfg.metal].r,envMapIntensity:1.3,clearcoat:.3,clearcoatRoughness:.1});
 Object.keys(GEMS).forEach(k=>gemMats[k]=gemMaterial(k));
 const velvet=new THREE.MeshPhysicalMaterial({name:'Terciopelo',color:FX.lin('#0b3a30'),roughness:.95,metalness:0,sheen:1,sheenColor:FX.lin('#4fb596'),sheenRoughness:.45,envMapIntensity:.35});
 // lacas/terciopelos/cristal del escenario
 Object.values(FX.LIB).forEach(o=>o.traverse(m=>{if(!m.isMesh)return;const n=m.material.name;if(n==='Cristal'){m.material.transparent=true;m.material.opacity=.18;m.material.depthWrite=false}if(n==='Laton'){m.material.envMapIntensity=1.3}if(n==='Ciclorama'){m.material.envMapIntensity=.35;m.castShadow=false}if(n==='Marmol'){m.material.envMapIntensity=.8}if(n==='Terciopelo'){m.material=velvet}}));
 const cyc=FX.get('Ciclorama');cyc.traverse(m=>{if(m.isMesh){m.receiveShadow=true;m.castShadow=false}});scene.add(cyc);
 const lupa=FX.get('Lupa');lupa.scale.setScalar(1.6);lupa.position.set(3.4,0,1.9);lupa.rotation.y=-.6;scene.add(lupa);
 const est=FX.get('Estuche');est.visible=false;est.scale.setScalar(1.7);est.position.set(-6.5,0,-4.5);est.rotation.y=.5;scene.add(est);const tp=FX.get('EstucheTapa');tp.visible=false;tp.position.copy(est.position);tp.scale.setScalar(1.7);tp.rotation.y=.5;scene.add(tp);tp.rotation.x=0;tp.rotation.order='YXZ';tp.rotation.x=-1.9;
 const vt=FX.get('Vitrina');vt.scale.setScalar(2.4);vt.position.set(-11,0,-13);vt.rotation.y=.35;scene.add(vt);
 scene.fog=new THREE.Fog(FX.lin('#e6e8ec'),16,40);
 camera.position.set(6,8,12);controls.target.set(0,2.5,0);
 build(cfg,'drop');renderTabs();renderOpts();renderLevel();updPrice();setMode('A');
 $('bsnd').innerHTML='<svg><use href="#i-'+(S.snd?'snd':'mute')+'"/></svg>';
 document.body.classList.add('ready');renderer.domElement.addEventListener('pointerdown',()=>FX.audio(),{once:true});
 FX.onFrame=frame;FX.start()});
FX.onResize=()=>{if(stage)frameCam(cfg.piece,.01)};

/* API de pruebas */
window.Q={set(k,v){if(k==='ct'){cfg.ct=+v;build(cfg,'pop');renderOpts();afterChange();return price()}if(k==='eng'){cfg.eng=String(v);build(cfg,'pop');afterChange();return price()}const t={piece:'piece',metal:'metal',gem:'gem',cut:'cut',set:'set'}[k];if(!t)return 'clave';tab=t;renderTabs();choose(t,v);return price()},
 mode(m){setMode(m);return order&&order.s},order(){return JSON.stringify(order)},deliver(){deliver();return S.hist.slice(-1)[0]},state(){return JSON.stringify({cfg,price:price(),S:{rep:S.rep,lvl:lvl(),orders:S.orders,designs:S.designs.length}})},
 rep(n){S.rep=+n;renderLevel();renderOpts();return lvl()},save(){$('bsave').click();return S.designs.length},
 ff(s){for(let i=0;i<s*30;i++){const dt=1/30;FX.t+=dt;FX.tweens.slice().forEach(w=>{w.t+=dt;const p=Math.min(1,w.t/w.dur),e=w.ease(p);for(const k in w.to)w.obj[k]=w.from[k]+(w.to[k]-w.from[k])*e;if(p>=1){FX.tweens.splice(FX.tweens.indexOf(w),1);w.done&&w.done()}});frame(dt,FX.t)}return 'ok'}};
</script>
