<!doctype html>
<html lang="es" data-app="colmena">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colmena</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#bfe3f0;--meadow:#d9ecc0;--bg:#9fd3e6;--bg2:#f6e7b0;--honey:#f2a900;--amber:#9c4a00;--wax:#fff1c9;--olive:#3f5a22;--blossom:#fffdf6;--fg:#2b1a05;
 --mut:#6d5634;--glass:rgba(255,251,240,.8);--line:rgba(156,74,0,.16);--acc:#f2a900;--disp:'Fraunces',Georgia,serif;--txt:'Hanken Grotesk',system-ui,sans-serif;--sheet:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(#9fd3e6,#d9ecc0 60%,#f6e7b0);color:var(--fg);font-family:var(--txt);overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);box-shadow:0 10px 30px -12px rgba(92,48,0,.35)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
svg.i{width:20px;height:20px;flex:none;display:block}
.disp{font-family:var(--disp);font-weight:800;font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 72}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#9fd3e6,#f6e7b0);z-index:50;transition:opacity .6s;font-family:var(--disp);font-weight:800;font-size:22px;color:var(--amber)}
#load .bar{width:160px;height:4px;border-radius:3px;background:rgba(156,74,0,.15);overflow:hidden}
#load .bar i{display:block;height:100%;width:40%;background:var(--honey);animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
/* entrada escalonada */
.st{opacity:0;transform:translateY(-10px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,1.4,.4,1)}
.st.in{opacity:1;transform:none}
#panel.st{transform:translateX(24px)}#panel.st.in{transform:none}
#dock.st{transform:translateY(16px)}#dock.st.in{transform:none}
/* cabecera */
#top{position:fixed;left:16px;top:14px;right:396px;display:flex;align-items:flex-start;gap:12px;pointer-events:none;z-index:5;flex-wrap:wrap}
.brand{padding:8px 14px 9px;pointer-events:auto}
.brand h1{margin:0;font-size:30px;line-height:.95;letter-spacing:-.01em;color:var(--amber);display:flex;align-items:center;gap:8px}
.brand h1 svg{width:26px;height:26px}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-top:3px;white-space:nowrap}
.res{display:flex;gap:8px;flex-wrap:wrap}
.card{min-width:112px;padding:7px 12px 8px;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;pointer-events:auto}
.card svg{grid-row:span 2;width:26px;height:26px}
.card b{font-family:var(--disp);font-weight:800;font-variation-settings:'SOFT' 100,'opsz' 48;font-size:21px;line-height:1.05;white-space:nowrap;font-variant-numeric:tabular-nums}
.card span{font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap;letter-spacing:.02em}
.card.bump b{animation:bump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.card.jelly{display:none}.card.jelly.on{display:grid}
.tools{display:flex;gap:8px;pointer-events:auto;margin-left:auto}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s,background .2s;position:relative}
.ib:hover{transform:translateY(-2px)}.ib:active{transform:scale(.94)}
.ib .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#e2541b;box-shadow:0 0 0 2px var(--blossom);display:none}
.ib.on .dot{display:block}
.ib.on{animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-9deg)}95%{transform:rotate(8deg)}}
/* panel lateral / hoja inferior */
#panel{position:fixed;right:16px;top:14px;bottom:16px;width:364px;display:flex;flex-direction:column;z-index:6;overflow:hidden}
.grab{display:none}
.tabs{display:flex;gap:4px;padding:10px 10px 0}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:12px;font-weight:800;font-size:14px;color:var(--mut);position:relative;min-height:42px;transition:background .2s,color .2s}
.tabs button.on{background:var(--fg);color:var(--wax)}
.tabs button .dot{position:absolute;top:7px;right:10px;width:8px;height:8px;border-radius:50%;background:#e2541b;display:none}
.tabs button.nt .dot{display:block}
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 4px;font-size:12px;font-weight:700;color:var(--mut)}
.amt{display:flex;background:rgba(156,74,0,.08);border-radius:10px;padding:3px}
.amt button{border:0;background:transparent;padding:6px 9px;border-radius:8px;font-weight:800;font-size:12px;min-width:40px;min-height:32px}
.amt button.on{background:var(--blossom);box-shadow:0 1px 4px rgba(92,48,0,.2)}
.flow{padding:0 14px 6px;font-size:11.5px;color:var(--mut);font-weight:600}
.flow .bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;margin-top:4px}
.flow i{display:block;height:6px;border-radius:4px;background:rgba(156,74,0,.12);overflow:hidden}.flow i u{display:block;height:100%;background:var(--honey);border-radius:4px;transition:width .4s}
.flow i.p u{background:var(--olive)}
.flow em{font-style:normal;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 10px 10px;scrollbar-width:thin}
.view{display:none;flex-direction:column;gap:8px}.view.on{display:flex}
.up{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.62);border-radius:16px;padding:9px 10px 9px 9px;position:relative;overflow:hidden;min-height:64px;transition:transform .15s,background .2s,border-color .2s,opacity .3s}
.up:hover:not(:disabled){transform:translateY(-1px);background:#fff;border-color:rgba(242,169,0,.6)}
.up:active:not(:disabled){transform:scale(.985)}
.up .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(160deg,#ffe7a3,#f2b632);color:var(--amber)}
.up .ic svg{width:26px;height:26px}
.up h4{margin:0;font-size:14.5px;font-weight:800;line-height:1.15;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.up h4 small{font-size:11px;font-weight:800;color:var(--amber);background:rgba(242,169,0,.18);padding:1px 6px;border-radius:6px}
.up p{margin:2px 0 0;font-size:12px;color:var(--mut);line-height:1.25}
.up .cost{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:4px;background:var(--fg);color:var(--wax);padding:6px 9px;border-radius:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.up .cost svg{width:15px;height:15px}
.up:disabled{cursor:default}
.up:disabled .cost{background:rgba(43,26,5,.1);color:var(--mut)}
.up .need{position:absolute;left:0;bottom:0;height:3px;background:var(--honey);transition:width .3s;border-radius:0 3px 3px 0}
.up .tag{position:absolute;top:0;right:12px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--olive);color:var(--wax);padding:2px 7px;border-radius:0 0 7px 7px;display:none}
.up.rec .tag{display:block}
.up.almost .tag{display:block;background:#e2541b}
.up.hid{opacity:.55}.up.hid .ic{filter:grayscale(1)}
.up.done{opacity:.6}
.up.new{animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
.swatch{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
/* hitos */
.mis{border:1px solid var(--line);background:rgba(255,255,255,.62);border-radius:16px;padding:11px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;transition:transform .3s,opacity .3s}
.mis h5{margin:0;font-size:14px;font-weight:800;line-height:1.2}
.mis .rw{font-size:12px;font-weight:800;color:var(--amber);display:flex;align-items:center;gap:3px;white-space:nowrap}
.mis .rw svg{width:14px;height:14px}
.mis .pb{grid-column:1/-1;height:7px;border-radius:5px;background:rgba(156,74,0,.12);overflow:hidden}
.mis .pb i{display:block;height:100%;background:linear-gradient(90deg,#f2a900,#ffcf4a);border-radius:5px;transition:width .4s}
.mis .pt{grid-column:1/-1;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:-2px;display:flex;justify-content:space-between}
.mis.ok{border-color:var(--honey);background:#fff7de;box-shadow:0 0 0 3px rgba(242,169,0,.22)}
.mis .claim{grid-column:1/-1;border:0;background:var(--honey);color:var(--fg);font-weight:800;border-radius:11px;min-height:40px;display:none}
.mis.ok .claim{display:block;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(242,169,0,.25)}}
.mis.out{transform:translateX(30px);opacity:0}
.hd{font-family:var(--disp);font-weight:800;font-variation-settings:'SOFT' 100;font-size:17px;margin:6px 4px 0;display:flex;justify-content:space-between;align-items:baseline}
.hd small{font-family:var(--txt);font-size:11.5px;color:var(--mut);font-weight:700}
.daily{border:1px dashed rgba(156,74,0,.35);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;background:rgba(255,241,201,.6)}
.daily .days{display:flex;gap:4px;flex:1}
.daily .days i{flex:1;height:26px;border-radius:7px;background:rgba(156,74,0,.1);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--mut)}
.daily .days i.d{background:var(--honey);color:var(--fg)}
.daily .days i.t{box-shadow:inset 0 0 0 2px var(--amber)}
.daily button{border:0;background:var(--fg);color:var(--wax);font-weight:800;border-radius:11px;padding:0 12px;min-height:40px;white-space:nowrap}
.daily button:disabled{background:rgba(43,26,5,.12);color:var(--mut);cursor:default}
/* colección de mieles */
.jars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.jar{border:1px solid var(--line);background:rgba(255,255,255,.62);border-radius:14px;padding:10px 6px 8px;text-align:center}
.jar svg{width:40px;height:48px;margin:0 auto 4px;display:block}
.jar b{display:block;font-size:13px}.jar span{font-size:11px;color:var(--mut);font-weight:700;font-variant-numeric:tabular-nums}
.jar.lock{opacity:.5}.jar.lock b{letter-spacing:.2em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--mut);font-weight:600}
.stats div{background:rgba(255,255,255,.5);border-radius:10px;padding:7px 9px}.stats b{display:block;color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
/* enjambrar */
.pres{margin:0 10px 10px;border-radius:16px;padding:10px 12px;background:linear-gradient(135deg,#2b1a05,#5a2f06);color:var(--wax);display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.pres .jl{display:none;align-items:center;gap:4px;font-family:var(--txt);font-size:12px;font-weight:800;background:rgba(255,241,201,.14);padding:2px 8px 2px 4px;border-radius:8px;margin-left:6px;vertical-align:2px}.pres .jl.on{display:inline-flex}.pres .jl svg{width:16px;height:16px;color:var(--wax)}
.pres h5{margin:0;font-family:var(--disp);font-weight:800;font-variation-settings:'SOFT' 100;font-size:16px}
.pres p{margin:0;font-size:11.5px;opacity:.8;grid-column:1/-1}
.pres .pb{grid-column:1/-1;height:6px;border-radius:4px;background:rgba(255,241,201,.18);overflow:hidden}.pres .pb i{display:block;height:100%;background:var(--honey);transition:width .4s}
.pres button{border:0;border-radius:11px;background:rgba(255,241,201,.15);color:var(--wax);font-weight:800;min-height:40px;padding:0 12px;white-space:nowrap}
.pres button:not(:disabled){background:var(--honey);color:var(--fg);animation:glow 1.4s ease-in-out infinite}
.pres button:disabled{cursor:default;opacity:.8}
/* dock */
#dock{position:fixed;left:16px;bottom:16px;display:flex;align-items:flex-end;gap:10px;z-index:5;max-width:calc(100% - 412px);flex-wrap:wrap}
#harvest{border:0;border-radius:20px;padding:10px 18px 10px 10px;display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--wax);min-height:64px;box-shadow:0 14px 30px -12px rgba(43,26,5,.6);position:relative;overflow:hidden;transition:transform .15s}
#harvest:active{transform:scale(.96)}
#harvest .jr{width:44px;height:44px;border-radius:13px;background:rgba(255,241,201,.12);display:grid;place-items:center;position:relative;overflow:hidden}
#harvest .jr i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#ffc83d,#e08d00);transition:height .3s}
#harvest .jr svg{position:relative;width:30px;height:30px}
#harvest b{display:block;font-family:var(--disp);font-weight:800;font-variation-settings:'SOFT' 100;font-size:19px;text-align:left;line-height:1.05}
#harvest span{display:block;font-size:12px;font-weight:600;opacity:.8;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
#harvest.full{animation:glow2 1.2s ease-in-out infinite}
@keyframes glow2{50%{box-shadow:0 0 0 6px rgba(242,169,0,.45),0 14px 30px -12px rgba(43,26,5,.6)}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:none;align-items:center;gap:7px;padding:8px 12px;border-radius:14px;font-size:12.5px;font-weight:800;min-height:40px}
.chip.on{display:flex;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.chip svg{width:18px;height:18px}
.chip.boost{background:#fff1c9;color:var(--amber);border:1px solid rgba(242,169,0,.5)}
.chip.fr{background:linear-gradient(90deg,#ffd75e,#f2a900);color:var(--fg)}
.chip.auto{background:var(--glass);border:1px solid var(--line);color:var(--olive)}
.chip.hint{background:var(--glass);border:1px solid var(--line);color:var(--mut);font-weight:700}
/* bocadillo tutorial anclado a 3D */
#tip{position:fixed;left:0;top:0;z-index:7;pointer-events:none;background:var(--fg);color:var(--wax);font-weight:800;font-size:13.5px;padding:9px 13px;border-radius:13px;transform:translate(-50%,-100%);opacity:0;transition:opacity .4s;max-width:230px;text-align:center;line-height:1.25}
#tip:after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--fg)}
#tip.on{opacity:1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{margin-top:-6px}}
/* flotantes */
.fl{position:fixed;left:0;top:0;z-index:8;pointer-events:none;font-family:var(--disp);font-weight:800;font-variation-settings:'SOFT' 100;font-size:22px;color:var(--fg);text-shadow:0 2px 0 var(--wax),0 0 12px rgba(255,241,201,.9);white-space:nowrap;transform:translate(-50%,-50%)}
.fl.crit{font-size:28px;color:#b85600}
.fc{position:fixed;left:0;top:0;width:22px;height:22px;z-index:9;pointer-events:none;margin:-11px 0 0 -11px}
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-10px);z-index:20;background:var(--fg);color:var(--wax);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:0 12px 30px -10px rgba(43,26,5,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* modal */
#modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(43,26,5,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modal.on{display:flex}
#modal .box{width:min(420px,100%);padding:22px 22px 18px;border-radius:24px;background:var(--blossom);box-shadow:0 30px 60px -20px rgba(43,26,5,.6);animation:pop .5s cubic-bezier(.2,1.4,.4,1);text-align:left;position:relative;overflow:hidden}
#modal .box:before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(242,169,0,.35),transparent 70%)}
#modal h2{margin:0 0 6px;font-family:var(--disp);font-weight:800;font-variation-settings:'SOFT' 100,'WONK' 1;font-size:28px;line-height:1.05;color:var(--amber)}
#modal p{margin:0 0 12px;font-size:14.5px;line-height:1.45;color:var(--fg)}
#modal .big{font-family:var(--disp);font-weight:800;font-size:40px;color:var(--fg);display:flex;align-items:center;gap:10px;margin:4px 0 12px;font-variant-numeric:tabular-nums}
#modal .big svg{width:36px;height:36px}
#modal .row{display:flex;gap:8px;flex-wrap:wrap}
#modal .row button{flex:1;min-height:48px;border-radius:14px;border:0;font-weight:800;font-size:15px;background:var(--honey);color:var(--fg);padding:0 14px}
#modal .row button.sec{background:rgba(43,26,5,.08)}
#fade{position:fixed;inset:0;z-index:25;background:#fff6dc;opacity:0;pointer-events:none;transition:opacity .7s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1100px) and (min-width:761px){#panel{width:330px}#top{right:360px}#dock{max-width:calc(100% - 380px)}.card{min-width:0}}
@media (max-width:760px){
 :root{--sheet:42vh}
 #top{left:10px;right:10px;top:10px;gap:6px}
 .brand{padding:6px 10px 7px;border-radius:14px}.brand h1{font-size:23px}.brand h1 svg{width:20px;height:20px}.brand small{font-size:10.5px}
 .tools .ib{width:42px;height:42px}
 .res{order:3;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
 .card{min-width:0;padding:5px 7px 6px;column-gap:5px;border-radius:13px}
 .card svg{width:18px;height:18px}.card b{font-size:15px}.card span{font-size:9.5px}
 #panel{left:0;right:0;bottom:0;top:auto;width:auto;height:var(--sheet);border-radius:22px 22px 0 0;transition:height .35s cubic-bezier(.2,1,.3,1)}
 #panel.st{transform:translateY(30px)}#panel.st.in{transform:none}
 #panel.big{height:78vh}
 .grab{display:block;border:0;background:transparent;height:22px;width:100%;flex:none;position:relative}
 .grab:before{content:'';position:absolute;left:50%;top:8px;width:44px;height:5px;border-radius:3px;margin-left:-22px;background:rgba(43,26,5,.25)}
 .tabs{padding:0 10px}
 .tabs button{padding:8px 4px;font-size:13.5px}
 #dock{left:10px;right:10px;bottom:calc(var(--sheet) + 8px);max-width:none;gap:6px;flex-wrap:nowrap;align-items:center}
 .chips{flex-wrap:nowrap;overflow:hidden;min-width:0}.chip{white-space:nowrap}
 #harvest span span{font-size:11px}
 #panel.big~#dock{opacity:0;pointer-events:none}
 #harvest{min-height:52px;padding:6px 12px 6px 6px;border-radius:16px;gap:9px;flex:none}#harvest .jr{width:38px;height:38px}#harvest b{font-size:16px}
 .chip{min-height:36px;padding:6px 10px;font-size:12px}
 #toast{top:auto;bottom:calc(var(--sheet) + 84px)}
 .pres{margin:0 10px 8px;padding:8px 12px;gap:4px 10px}.pres p{display:none}.pres.early{display:none}#neck{display:none}.pres h5{font-size:15px}.pres button{min-height:36px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Colmenar en 3D: toca las colmenas para cosechar y las flores para atraer abejas"></canvas>
<div id="load"><div>Despertando a las abejas…</div><div class="bar"><i></i></div></div>

 const pp=fh/(2*Math.tan(camera.fov*Math.PI/360)),nd=Math.max((mob?9.4:13.4)*pp/Wv,(mob?7.6:8.6)*pp/Hv);
 if(!R.intro){const cur=camera.position.distanceTo(controls.target);zoomK=clamp(cur/fitD,.5,1.4)}fitD=nd;controls.minDistance=fitD*.5;controls.maxDistance=fitD*1.35;
 if(!R.intro){const off=camera.position.clone().sub(controls.target).setLength(fitD*zoomK);camera.position.copy(controls.target).add(off)}}
FX.onResize=()=>{if(R.ready)layout()};
function sph(r,phi,th){return new V3(r*Math.sin(phi)*Math.sin(th),r*Math.cos(phi),r*Math.sin(phi)*Math.cos(th)).add(controls.target)}
function intro(){const o={k:0};camera.position.copy(sph(fitD*2.1,.18,-1));camera.lookAt(controls.target);
 FX.tween(o,{k:1},FX.reduced?.01:2.6,'inOut',()=>{stepIntro();R.intro=false;controls.enabled=true;layout();afterIntro()});R.introO=o;
 document.querySelectorAll('.st').forEach((e,i)=>setTimeout(()=>e.classList.add('in'),700+i*90))}
function stepIntro(){const k=R.introO.k;camera.position.copy(sph(fitD*lerp(2.1,1,k),lerp(.18,HOME.phi,k),lerp(-1,HOME.theta,k)));camera.lookAt(controls.target)}
function afterIntro(){const away=S.last>0?Date.now()-S.last:0;offlineCheck(away);if(dailyReady()&&(S.lastDay>=0||S.collects>0))setTimeout(openDaily,400);
 S.last=Date.now();R.nextBut=now()+(S.butterflies?rnd(60,180):rnd(45,70));save()}

/* ---------- entrada ---------- */
let pd=null;const cv=renderer.domElement;

let hvT=0;cv.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||performance.now()-hvT<120||R.intro)return;hvT=performance.now();const h=pick(e.clientX,e.clientY);cv.style.cursor=h?'pointer':'grab'});
cv.tabIndex=0;addEventListener('keydown',e=>{if(R.modalOn||e.target.tagName==='BUTTON')return;if(e.key===' '||e.key==='Enter'){e.preventDefault();gesture();collect('jar',true)}});
$('harvest').addEventListener('click',()=>{gesture();R.lastHive=null;collect('jar',true)});
$('bSnd').addEventListener('click',()=>{S.sound=S.sound?0:1;FX.muted=!S.sound;$('bSnd').innerHTML='<svg class="i"><use href="#i-'+(S.sound?'snd':'mute')+'"/></svg>';if(S.sound){FX.audio();startHum();tone('buy')}setHum();toast(S.sound?'Sonido activado':'Sonido silenciado');save()});
$('bSnd').innerHTML='<svg class="i"><use href="#i-'+(S.sound?'snd':'mute')+'"/></svg>';
$('bDaily').addEventListener('click',()=>{gesture();openDaily()});$('bDaily2').addEventListener('click',()=>{gesture();openDaily()});
$('bPres').addEventListener('click',()=>{gesture();askPrestige()});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{R.view=b.dataset.v;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+R.view));if(R.view==='col')renderCol(true);if(R.view==='mis'){renderDaily();renderMis()}$('scroll').scrollTop=0}));
$('amt').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{R.amt=b.dataset.n==='max'?'max':+b.dataset.n;$('amt').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderShop()}));
$('grab').addEventListener('click',()=>{$('panel').classList.toggle('big');setTimeout(layout,380)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){flushXP(true);save()}else{const away=Date.now()-S.last;if(away>=60e3&&!R.intro)offlineCheck(away);else if(away>0)ECO.step(S,Math.min(60,away/1000));S.last=Date.now();R.lastNow=performance.now()}});
addEventListener('pagehide',()=>{flushXP(true);save()});

/* ---------- bucle ---------- */
let birdT=5;
FX.load(()=>{
 build();ECO.fillMissions(S,fmt);buildShop();syncVisual();R.cells.forEach((c,j)=>{if(j<S.cells)c.t0=-1});
 R.ready=true;layout();updateSky();intro();renderShop();renderMis();renderDaily();hud(true);dropAll();hives.forEach((h,i)=>h.userData.delay=1.1+i*.28);
 FX.onFrame=(dt,t)=>{const T=now(),rdt=Math.min(1,(performance.now()-R.lastNow)/1000);R.lastNow=performance.now();U.time.value=t;U.wind.value=.75+.35*Math.sin(t*.23)+.15*Math.sin(t*.71);
  if(!R.pres)ECO.step(S,rdt,mulNow());
  if(R.intro&&R.introO)stepIntro();else{controls.update();R.idle+=dt;if(R.idle>12&&!FX.reduced&&!R.pres)controls.autoRotate=true}
  /* colmenas: caída con rebote y aplastamiento al tocar */
  hives.forEach(h=>{const u=h.userData;if(!u.land){if(u.delay>0){u.delay-=dt;return}u.vy-=18*dt;h.position.y+=u.vy*dt;if(h.position.y<=u.y){h.position.y=u.y;if(u.vy<-2.5){u.vy*=-.28;if(!u.b1){u.b1=1;FX.burst(h.position.clone().add(_v.set(0,.05,0)),{count:24,color:'#c9a577',speed:1.4,life:.7,gravity:-2,spread:.5});FX.shake(.04);tone('thud')}}else{u.vy=0;u.land=true;u.b1=0;u.sq=.6}}}
   if(u.sq>0){u.sq=Math.max(0,u.sq-dt*2.2);const s=Math.sin(u.sq*Math.PI*2.5)*u.sq*.12;h.scale.set(K*(1+s*.5),K*(1-s),K*(1+s*.5))}});
  /* apicultor */
  if(keeper.userData.on){const s=keeper.userData.s;keeper.scale.setScalar(Math.max(1e-4,s*.95));keeper.children[0].rotation.y=Math.sin(t*.6)*.12;keeper.children[1].rotation.z=Math.sin(t*1.3)*.05;
   R.autoT+=rdt;if(R.autoT>=ECO.SMOKE[S.smoker]){R.autoT=0;if(S.honey>=.5&&!R.pres){collect('jar',false);FX.burst(keeper.position.clone().add(_v.set(.2,1.1,.15)),{count:10,color:'#e8e2d4',speed:.5,life:1.4,gravity:.8,drag:2})}}}
  stepCells(dt,t);if(R.jarKick){R.jarKick=Math.max(0,R.jarKick-dt*2.5);const s=Math.sin(R.jarKick*Math.PI*3)*R.jarKick*.08;jarGroup.scale.set(1.5*(1+s),1.5*(1-s),1.5*(1+s))}
  if(R.combKick){R.combKick=Math.max(0,R.combKick-dt*2);frame.rotation.z=Math.sin(R.combKick*Math.PI*4)*R.combKick*.02}
  patches.forEach((p,i)=>{if(p.gT>-9){if(!setPatchMatrices(i))p.gT=-9}const on=T<R.boostUntil&&R.boostPatch===i;p.ring.material.opacity=on?.35+.25*Math.sin(t*6):Math.max(0,p.ring.material.opacity-dt);
   if(on&&Math.random()<dt*8&&!FX.reduced){const q=p.pts[(Math.random()*p.pts.length)|0];FX.burst(_v.set(q.x,q.y+p.P.h,q.z),{count:2,color:'#ffe066',speed:.5,life:.9,gravity:.3})}});
  stepBees(dt,t);stepCoins(dt);
  butterflies.forEach(b=>stepButterfly(b,dt,t));if(goldB&&!stepButterfly(goldB,dt,t)){scene.remove(goldB.g);tapTargets.splice(tapTargets.indexOf(goldB.g),1);if(!goldB.caught){toast('La mariposa dorada se fue… la próxima no se escapa');R.nextBut=T+rnd(60,180)}goldB=null}
  if(!goldB&&R.nextBut&&T>R.nextBut&&!R.intro&&!R.modalOn)spawnGold();
  clouds.forEach(c=>{const u=c.userData;u.a+=u.sp*dt;c.position.set(Math.cos(u.a)*u.r,u.y+Math.sin(t*.1+u.r)*.2,Math.sin(u.a)*u.r)});
  R.tree.rotation.z=Math.sin(t*.8)*.006*U.wind.value;
  /* ambiente: polen en el sol o luciérnagas de noche */
  if(!FX.reduced&&Math.random()<dt*(night?6:3)){const a=Math.random()*TAU,r=Math.sqrt(Math.random())*5.5,x=Math.cos(a)*r,z=Math.sin(a)*r;
   FX.burst(_v.set(x,HT(x,z)+rnd(.3,1.6),z),night?{count:1,color:'#d9ff6a',speed:.15,life:2.8,gravity:.05,drag:.5}:{count:1,color:'#fff0b0',speed:.1,life:3,gravity:.03,drag:.4})}
  birdT-=dt;if(birdT<0){birdT=rnd(6,16);if(!night&&R.started)tone('bird')}
  if(R.tip!==undefined)tipUpdate();
  R.skyT+=rdt;if(R.skyT>30){R.skyT=0;updateSky()}
  shT+=rdt;if(shT>.4||hives.some(h=>!h.userData.land||h.userData.sq>0)||keeper.userData.on&&keeper.userData.s<1){shT=0;renderer.shadowMap.needsUpdate=true}
  R.hudT+=rdt;if(R.hudT>.25){R.hudT=0;hud()}
  R.saveT+=rdt;if(R.saveT>5){R.saveT=0;save();flushXP()}};
 FX.start()},e=>{console.warn(e)});
/* bocadillo del tutorial anclado en 3D */
function tipUpdate(){const e=$('tip');let p=null,t='';if(R.intro||R.modalOn||R.pres){e.classList.remove('on');return}
 if(S.tut===0&&hives[0]){p=hives[0].position.clone().add(_v2.set(0,1.5,0));t='Toca la colmena para cosechar la miel'}
 else if(S.tut===2&&patches[0]){p=new V3(patches[0].P.x,HT(patches[0].P.x,patches[0].P.z)+.75,patches[0].P.z);t='Toca las flores: las abejas trabajan ×3'}
 if(!p){e.classList.remove('on');return}const s=scr(p);if(!s.ok||s.x<0||s.x>innerWidth){e.classList.remove('on');return}
 if(e.textContent!==t)e.textContent=t;e.style.left=clamp(s.x,120,innerWidth-120)+'px';e.style.top=s.y+'px';e.classList.add('on')}
document.addEventListener('pointerdown',()=>{R.started=true},{once:true});

window.H={skip(){const tw=FX.tweens.splice(0);tw.forEach(w=>{for(const k in w.to)w.obj[k]=w.to[k];w.done&&w.done()});hives.forEach(h=>{h.userData.delay=0;h.userData.land=true;h.position.y=h.userData.y});R.cells.forEach(c=>{if(c.t0>-5)c.t0=-9+8});document.querySelectorAll('.st').forEach(e=>e.classList.add('in'));return 'ok'},add(n){ECO.gain(S,ECO.num(n,0));hud(true);return S.coins},tick(s){s=ECO.num(s,0,0,1e7);for(let k=0;k<200;k++)ECO.step(S,s/200,1);hud(true);return S.honey},state(){return JSON.stringify(S).slice(0,300)},
 buy(id,n){R.amt=n||1;buyItem(id);R.amt=1;return id+':'+ECO.level(S,id)},collect(){return collect('jar',true)},butterfly(d){R.nextBut=0;spawnGold();if(goldB&&d)goldB.dur=d;return !!goldB},catchB(){catchGold()},prestige(){doPrestige()},
 offline(sec){S.last=Date.now()-sec*1000;return offlineCheck(sec*1000)},hour(h){R.hourOv=h;updateSky();return $('phase').textContent},daily(){openDaily()},
 load(o){S=ECO.sanitize(o);syncVisual();R.cells.forEach((c,j)=>c.t0=j<S.cells?-1:-9);renderShop();renderMis();hud(true);return S},boost(i){onTapPatch(i??0)},view(v){document.querySelector(`.tabs [data-v="${v}"]`).click()},fmt};
