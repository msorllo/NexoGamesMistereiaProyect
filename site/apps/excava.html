<!doctype html>
<html lang="es" data-app="excava">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yacimiento</title>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ochre:#d99a5b;--soil:#3b2416;--parch:#f4e7cf;--teal:#2a7f7a;--rust:#b4532a;--mut:#8a6a52}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e8b77c;color:var(--soil);font-family:'IBM Plex Sans Condensed',system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:fixed;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.tag{background:var(--parch);border:2px solid var(--soil);border-radius:4px;padding:8px 14px;box-shadow:4px 4px 0 var(--soil);pointer-events:auto}
h1{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:clamp(26px,4vw,40px);margin:0;line-height:1;color:var(--soil)}
.tag small{display:block;font-size:13px;font-weight:700;color:var(--rust);letter-spacing:.06em;text-transform:uppercase}
.meter{background:var(--parch);border:2px solid var(--soil);border-radius:4px;padding:8px 12px;box-shadow:4px 4px 0 var(--soil);min-width:240px;pointer-events:auto}
.meter .row{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.meter .row b{font-family:'Alfa Slab One';font-weight:400;font-size:20px}
.en{height:12px;border:2px solid var(--soil);margin-top:4px;background:#fff}.en i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--rust) 0 8px,#c96a3d 8px 10px);transition:width .3s}
.tools{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;background:var(--parch);border:2px solid var(--soil);border-radius:6px;padding:8px;box-shadow:4px 4px 0 var(--soil);max-width:calc(100% - 32px);flex-wrap:wrap;justify-content:center}
.tool{font:inherit;font-weight:700;font-size:14px;border:2px solid var(--soil);background:#fff;color:var(--soil);border-radius:4px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:88px;line-height:1.1}
.tool small{font-weight:400;font-size:11px;color:var(--mut)}
.tool.on{background:var(--soil);color:var(--parch)}.tool.on small{color:#e8c9a0}
.tool:disabled{opacity:.4;cursor:not-allowed}
.tool:focus-visible,.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.hint{position:fixed;left:16px;bottom:96px;background:rgba(244,231,207,.94);border-left:5px solid var(--teal);padding:10px 14px;max-width:340px;font-size:15px;line-height:1.35;box-shadow:3px 3px 0 rgba(59,36,22,.4)}
.hint b{color:var(--teal)}
.card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(59,36,22,.5);padding:16px;z-index:5}
.card[hidden]{display:none}
.card .in{background:var(--parch);border:3px solid var(--soil);box-shadow:8px 8px 0 var(--soil);padding:20px 24px;max-width:420px;width:100%;text-align:center}
.card h2{font-family:'Alfa Slab One';font-weight:400;font-size:30px;margin:0}
.card .era{font-weight:700;color:var(--rust);text-transform:uppercase;letter-spacing:.1em;font-size:12px;margin:4px 0 10px}
.card img{width:180px;height:180px;display:block;margin:0 auto;image-rendering:auto}
.card p{line-height:1.45;margin:10px 0}
.rar{display:inline-block;font-weight:700;font-size:12px;padding:3px 8px;border:2px solid var(--soil);margin-bottom:8px}
.btn{font:inherit;font-weight:700;font-size:15px;border:2px solid var(--soil);background:var(--teal);color:#fff;padding:10px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--soil);margin:4px}
.btn.alt{background:#fff;color:var(--soil)}
.mus{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:12px 0;text-align:center;font-size:13px;font-weight:700}
.mus div{border:2px solid var(--soil);background:#fff;padding:6px}
.mus img{width:90px;height:90px;display:block;margin:0 auto}
.mus .no{filter:brightness(0) opacity(.25)}
.mus small{display:block;font-weight:400;color:var(--mut)}
.sites{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.site{font:inherit;text-align:left;border:2px solid var(--soil);background:#fff;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--soil)}
.site b{font-family:'Alfa Slab One';font-weight:400;font-size:18px;display:block}
.site:disabled{opacity:.45;cursor:not-allowed}
.load{position:fixed;inset:0;display:grid;place-items:center;font-family:'Alfa Slab One';font-size:24px;color:var(--soil)}
@media (max-width:720px){.meter{min-width:0}.hint{bottom:150px;right:16px;max-width:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="load" id="load">Montando el campamento…</div>
<div class="top"><div class="tag"><h1>Yacimiento</h1><small id="siteN"></small></div><div class="meter"><div class="row"><span>Energía</span><b id="enN">45</b></div><div class="en"><i id="en"></i></div><div class="row" style="margin-top:6px"><span>Hallazgos</span><b id="fdN">0/0</b></div></div></div>
<div class="hint" id="hint">Usa el <b>pico</b> para retirar tierra. Cuando veas <b>destellos</b> en una cara, hay algo dentro: cámbiate al <b>pincel</b> para sacarlo intacto.</div>
<div class="tools"><button class="tool on" data-t="pico">Pico<small>1 energía</small></button><button class="tool" data-t="pincel">Pincel<small>extrae · sondea</small></button><button class="tool" data-t="radar" id="radarB">Radar<small id="rdN">3 usos</small></button><button class="tool" id="museoB">Museo<small id="muN">0/7</small></button></div>
<div class="card" id="card" hidden><div class="in" id="cardIn"></div></div>

function click(e){if(!active||energy<=0)return;mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,camera);const h=ray.intersectObject(inst)[0];if(!h)return;const k=h.instanceId;if(!vox[k])return;
 if(tool==='radar'){if(radar<=0)return;radar--;energy--;const ks=Object.keys(finds).filter(f=>vox[f]);if(ks.length){const x=k%W,z=Math.floor(k/W)%D;let best=ks[0],bd=1e9;ks.forEach(f=>{const fx=f%W,fz=Math.floor(f/W)%D;const d=Math.abs(fx-x)+Math.abs(fz-z);if(d<bd){bd=d;best=f}});const bx=best%W,bz=Math.floor(best/W)%D;const beam=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,14,16,1,true),new THREE.MeshBasicMaterial({color:'#2ad4c8',transparent:true,opacity:.35,depthWrite:false,side:THREE.DoubleSide}));beam.position.copy(pos(bx,HL/2,bz));beam.userData.l=2.2;scene.add(beam);dust.push(beam);hint('El radar marca una <b>columna</b>: el hallazgo más cercano está bajo ella.')}ping(660);ui();endCheck();return}
 if(tool==='pincel'){energy--;if(finds[k]){if(!exposed(k)){hint('Aún está enterrado del todo. Destapa alguna cara con el pico.');energy++;return}extract(k,false)}else{const x=k%W,z=Math.floor(k/W)%D,y=Math.floor(k/(W*D));let md=99;for(const f in finds){if(!vox[f])continue;const fx=f%W,fz=Math.floor(f/W)%D,fy=Math.floor(f/(W*D));md=Math.min(md,Math.abs(fx-x)+Math.abs(fz-z)+Math.abs(fy-y))}hint(md<=2?'Sondeo: <b>¡caliente!</b> Hay algo muy cerca.':md<=4?'Sondeo: <b>templado</b>. No muy lejos.':'Sondeo: <b>frío</b>. Prueba en otra zona.');ping(md<=2?880:md<=4?560:320)}ui();endCheck();return}
 // pico
 energy--;if(finds[k]){extract(k,true)}else{vox.hp[k]--;if(vox.hp[k]<=0)remove(k);else{puff(h.point);hint('Roca dura: necesita otro golpe.')}thud()}ui();endCheck()}
function extract(k,damaged){const n=finds[k];delete finds[k];remove(k);const f=FINDS[n];const p=damaged?Math.round(f.pts/2):f.pts;pts+=p;found.push({n,damaged});const isNew=!S.museum[n]||S.museum[n]==='d'&&!damaged;S.museum[n]=damaged&&S.museum[n]!=='ok'?'d':'ok';OS.save('s',S);
 const x=k%W,z=Math.floor(k/W)%D,y=Math.floor(k/(W*D));const o=get(n);o.scale.setScalar(1.6);o.position.copy(pos(x,y,z));o.userData.rise=pos(x,y,z).add(new THREE.Vector3(0,HL-y+1.2,0));scene.add(o);shows.push(o);
 const light=new THREE.PointLight('#ffe6a0',3,6);o.add(light);[523,659,784,1046].forEach((f,i)=>setTimeout(()=>ping(f),i*90));
 OS.xp(Math.round(p/4)+(isNew?15:0),(damaged?'Hallazgo dañado: ':'Hallazgo: ')+f.n);if(!damaged)OS.achieve('exc_clean','Manos de cirujano','Extrajiste un fósil intacto con el pincel');if(n==='Craneo'&&!damaged)OS.achieve('exc_rex','Cazador de dinosaurios','Encontraste un cráneo de terópodo intacto');if(Object.values(S.museum).filter(v=>v==='ok').length===7)OS.achieve('exc_all','Conservador del museo','Las 7 piezas intactas en tu museo');
 setTimeout(()=>showCard(n,damaged,p,isNew),900)}
function showCard(n,damaged,p,isNew){const f=FINDS[n];document.getElementById('cardIn').innerHTML=`<span class="rar">${f.r}</span><h2>${f.n}</h2><div class="era">${f.era}</div><img src="${thumbs[n]||''}" alt="${f.n}"><p>${f.d}</p><p><b>${damaged?'Dañado por el pico · ':''}+${p} puntos</b>${isNew?' · <b style="color:#2a7f7a">¡Nueva pieza para el museo!</b>':''}</p><button class="btn" id="cOk">Seguir excavando</button>`;document.getElementById('card').hidden=false;document.getElementById('cOk').onclick=()=>{document.getElementById('card').hidden=true;endCheck()}}
function endCheck(){if(!document.getElementById('card').hidden)return;const left=Object.keys(finds).length;if(active&&(energy<=0||left===0)){active=false;S.exp++;S.best=Math.max(S.best,pts);OS.save('s',S);OS.xp(20+found.length*5,'Expedición en '+site.n);
 setTimeout(()=>{document.getElementById('cardIn').innerHTML=`<h2>${left===0?'¡Yacimiento agotado!':'Sin energía'}</h2><div class="era">${site.n}</div><p>${found.length} hallazgos · <b>${pts} puntos</b>${pts>=S.best&&pts>0?' · ¡récord!':''}</p><div class="mus">${found.map(f=>`<div><img src="${thumbs[f.n]}" alt=""><span>${FINDS[f.n].n}</span><small>${f.damaged?'dañado':'intacto'}</small></div>`).join('')||'<div>Nada esta vez</div>'}</div><button class="btn" id="again">Nueva expedición</button>`;document.getElementById('card').hidden=false;document.getElementById('again').onclick=sitesMenu},600)}}
function sitesMenu(){const have=Object.keys(S.museum).length;document.getElementById('cardIn').innerHTML=`<h2>Elige yacimiento</h2><div class="era">Tu museo: ${have}/7 piezas</div><div class="sites">${SITES.map((s,i)=>`<button class="site" data-i="${i}" ${have<s.need?'disabled':''}><span><b>${s.n}</b>${s.pool.map(p=>FINDS[p].n).slice(0,3).join(' · ')}</span><span>${have<s.need?'Necesitas '+s.need+' piezas':'Ir →'}</span></button>`).join('')}</div>`;document.getElementById('card').hidden=false;document.querySelectorAll('.site').forEach(b=>b.onclick=()=>start(+b.dataset.i))}
function museum(){const keys=Object.keys(FINDS);document.getElementById('cardIn').innerHTML=`<h2>Tu museo</h2><div class="era">${Object.keys(S.museum).length}/7 piezas · ${S.exp} expediciones</div><div class="mus">${keys.map(k=>`<div><img class="${S.museum[k]?'':'no'}" src="${thumbs[k]}" alt=""><span>${S.museum[k]?FINDS[k].n:'???'}</span><small>${S.museum[k]==='ok'?'intacta':S.museum[k]==='d'?'dañada':FINDS[k].r}</small></div>`).join('')}</div><button class="btn" id="cOk">Cerrar</button> <button class="btn alt" id="cSites">Cambiar de yacimiento</button>`;document.getElementById('card').hidden=false;document.getElementById('cOk').onclick=()=>{document.getElementById('card').hidden=true;if(!active)sitesMenu()};document.getElementById('cSites').onclick=sitesMenu}
function hint(h){document.getElementById('hint').innerHTML=h}
function ui(){document.getElementById('enN').textContent=Math.max(0,energy);document.getElementById('en').style.width=Math.max(0,energy)/45*100+'%';const tot=found.length+Object.keys(finds).length;document.getElementById('fdN').textContent=found.length+'/'+tot;document.getElementById('rdN').textContent=radar+' usos';document.getElementById('radarB').disabled=radar<=0;document.getElementById('muN').textContent=Object.keys(S.museum).length+'/7'}
document.querySelectorAll('.tool[data-t]').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('.tool[data-t]').forEach(x=>x.classList.toggle('on',x===b))});document.getElementById('museoB').onclick=museum;
let ac;function tone(f,d,type='sine',v=.06){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function thud(){tone(90+Math.random()*30,.18,'triangle',.12);tone(1800,.03,'square',.02)}function ping(f){tone(f,.35,'sine',.05)}
function makeThumbs(){const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(180,180);r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;const s=new THREE.Scene();s.add(new THREE.HemisphereLight('#fff','#8a6a52',1));const d=new THREE.DirectionalLight('#fff',1.4);d.position.set(2,3,2);s.add(d);const c=new THREE.PerspectiveCamera(35,1,.01,50);
 for(const n in FINDS){const o=get(n);s.add(o);const b=new THREE.Box3().setFromObject(o),sz=b.getSize(new THREE.Vector3()).length(),ct=b.getCenter(new THREE.Vector3());c.position.copy(ct).add(new THREE.Vector3(.6,.5,1).normalize().multiplyScalar(sz*1.5));c.lookAt(ct);r.render(s,c);thumbs[n]=r.domElement.toDataURL();s.remove(o)}r.dispose()}
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
 sparkles.forEach(s=>{s.m.rotation.y+=dt*3;s.m.scale.setScalar(.8+Math.sin(t*6+s.k)*.4)});
 dust.forEach(m=>{m.userData.l-=dt;if(m.userData.v){m.userData.v.y-=9*dt;m.position.addScaledVector(m.userData.v,dt);m.rotation.x+=dt*5}else m.material.opacity=Math.max(0,m.userData.l/2.2)*.35;if(m.userData.l<=0){scene.remove(m);m.dead=1}});dust=dust.filter(m=>!m.dead);
 shows.forEach(o=>{if(o.userData.rise){o.position.lerp(o.userData.rise,.05);o.rotation.y+=dt*1.2}});
 controls.update();R.render(scene,camera)}
new THREE.GLTFLoader().parse(b64(GLB),'',g=>{g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});[...g.scene.children].forEach(c=>LIB[c.name]=c);document.getElementById('load').remove();setup();makeThumbs();start(0);loop()},()=>document.getElementById('load').textContent='No se pudieron cargar los modelos 3D.');
