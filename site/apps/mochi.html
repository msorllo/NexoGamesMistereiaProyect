<!doctype html>
<html lang="es" data-app="mochi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mochi</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--peach:#ffd9c7;--pink:#ff9eb5;--mint:#b8f2e6;--cream:#fff8f0;--cocoa:#5b3a3a;--sun:#ffd166;--lav:#cdb4f6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--peach);color:var(--cocoa);font-family:'Baloo 2',system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:16px;display:grid;grid-template-columns:1fr 300px;gap:16px}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:'Mochiy Pop One',sans-serif;font-weight:400;font-size:clamp(30px,5vw,44px);margin:0;color:var(--cocoa);letter-spacing:.02em}
h1 span{color:var(--pink)}
.coins{background:var(--cream);border-radius:999px;padding:6px 14px 6px 8px;font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:0 4px 0 #f0b9a3}
.coins i{width:24px;height:24px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-style:normal;font-size:13px;box-shadow:inset 0 -3px 0 #e8a93a}
.room{position:relative;border-radius:36px;overflow:hidden;min-height:440px;box-shadow:0 8px 0 #f0b9a3;transition:background .6s}
.room.bg0{background:linear-gradient(#fff3ea 0 62%,#ffc9b5 62%)}
.room.bg1{background:linear-gradient(#c9f2ff 0 62%,#9fe3a8 62%)}
.room.bg2{background:linear-gradient(#2b2d5c 0 62%,#f2d6a2 62%)}
.room.bg3{background:linear-gradient(#ffe4f3 0 62%,#cdb4f6 62%)}
.room.night::after{content:'';position:absolute;inset:0;background:rgba(20,16,50,.62);pointer-events:none}
.win{position:absolute;left:8%;top:9%;width:24%;aspect-ratio:1;border-radius:18px;background:#bfe9ff;border:8px solid var(--cream);overflow:hidden}
.win::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--cream)}
.bg2 .win{background:#12143a}.bg2 .win::before{content:'';position:absolute;right:18%;top:18%;width:22%;aspect-ratio:1;border-radius:50%;box-shadow:6px 4px 0 #ffe9a8}
.frame{position:absolute;right:10%;top:12%;width:16%;aspect-ratio:3/4;border-radius:12px;background:var(--mint);border:6px solid var(--cream)}
.pet{position:absolute;left:50%;bottom:10%;width:min(260px,46%);transform:translateX(-50%);cursor:pointer;filter:drop-shadow(0 12px 0 rgba(91,58,58,.12))}
.pet svg{width:100%;overflow:visible;display:block}
.pet .body{animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
.pet.squish .body{animation:squish .45s ease}
.pet.hop .body{animation:hop .5s ease}
@keyframes breathe{50%{transform:scale(1.03,.97)}}
@keyframes squish{30%{transform:scale(1.18,.78)}60%{transform:scale(.92,1.1)}}
@keyframes hop{40%{transform:translateY(-40px) scale(.95,1.06)}}
.bubble{position:absolute;left:50%;top:10%;transform:translateX(-10%);background:var(--cream);padding:10px 16px;border-radius:20px 20px 20px 4px;font-weight:700;max-width:60%;box-shadow:0 4px 0 #f0b9a3;font-size:16px;z-index:2}
.fx{position:absolute;pointer-events:none;font-size:26px;animation:float 1.2s ease-out forwards;z-index:3}
@keyframes float{to{transform:translateY(-90px) scale(1.3);opacity:0}}
.namebar{position:absolute;left:18px;bottom:14px;background:var(--cream);border-radius:14px;padding:4px 12px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #f0b9a3;z-index:2}
.namebar small{font-weight:600;color:#a07a7a}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--cream);border-radius:26px;padding:16px;box-shadow:0 6px 0 #f0b9a3}
.card h3{font-family:'Mochiy Pop One',system-ui,sans-serif;font-weight:400;font-size:15px;margin:0 0 10px}
.stat{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:6px}
.meter{height:14px;border-radius:10px;background:#f6e3da;overflow:hidden}.meter i{display:block;height:100%;border-radius:10px;transition:width .5s}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{border:0;border-radius:18px;padding:12px 6px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;color:var(--cocoa);box-shadow:0 4px 0 rgba(91,58,58,.18);transition:transform .1s}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(91,58,58,.18)}
.act:focus-visible,.shopi:focus-visible{outline:3px solid var(--cocoa);outline-offset:2px}
.a1{background:var(--sun)}.a2{background:var(--pink)}.a3{background:var(--lav)}.a4{background:var(--mint)}
.xp{height:10px;border-radius:6px;background:#f6e3da;margin-top:4px}.xp i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--pink),var(--lav))}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.shopi{border:0;background:#fff;border-radius:14px;padding:6px 2px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;color:var(--cocoa);display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:inset 0 0 0 2px #f6e3da}
.shopi.on{box-shadow:inset 0 0 0 3px var(--pink)}
.shopi svg{width:34px;height:28px}
.shopi .pr{color:#c98a2e}
.food{display:flex;gap:6px;margin-top:8px}.food[hidden]{display:none}
.food button{flex:1;border:0;background:#fff;border-radius:12px;padding:6px;cursor:pointer;font:inherit;font-size:12px;font-weight:700;color:var(--cocoa);box-shadow:inset 0 0 0 2px #f6e3da}
.game{position:fixed;inset:0;background:rgba(255,217,199,.96);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.game[hidden]{display:none}
.game canvas{width:min(560px,100%);aspect-ratio:3/4;max-height:78vh;border-radius:28px;background:linear-gradient(#cdefff,#fff3ea);box-shadow:0 8px 0 #f0b9a3;touch-action:none}
.game .gh{display:flex;gap:18px;font-weight:800;margin-bottom:8px;font-size:18px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.room{min-height:360px}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Mochi<span>♥</span></h1><div class="coins"><i>¢</i><span id="coins">0</span> monedas</div></header>
  <div class="room bg0" id="room">
    <div class="win"></div><div class="frame"></div>
    <div class="bubble" id="bubble">¡Hola! ¿Jugamos?</div>
    <div class="pet" id="pet" title="Acaríciame"><svg viewBox="0 0 200 190" id="petsvg"></svg></div>
    <div class="namebar"><span id="pname">Mochi</span> <small>· nivel <span id="plv">1</span></small></div>
  </div>
  <div class="side">
    <div class="card"><h3>Cómo está</h3><div id="stats"></div><div style="font-size:12px;font-weight:700;margin-top:6px">Cariño · <span id="xpT"></span></div><div class="xp"><i id="xpb"></i></div></div>
    <div class="card"><h3>Cuidar</h3><div class="acts"><button class="act a1" id="feed">Comer</button><button class="act a2" id="play">Jugar</button><button class="act a3" id="sleep">Dormir</button><button class="act a4" id="bath">Bañar</button></div>
      <div class="food" id="food" hidden><button data-f="0">Onigiri<br>gratis</button><button data-f="1">Fresa<br>3 ¢</button><button data-f="2">Pastel<br>8 ¢</button></div></div>
    <div class="card"><h3>Tienda</h3><div class="shop" id="shop"></div></div>
  </div>
</div>
<div class="game" id="game" hidden><div class="gh"><span>⭐ <span id="gs">0</span></span><span>⏱ <span id="gt">20</span> s</span><span>♥ <span id="gl">3</span></span></div><canvas id="gc" width="480" height="640"></canvas><p style="font-weight:700">Mueve a Mochi para atrapar estrellas y dulces. ¡Evita las nubes de tormenta!</p></div>
<script>
const HATS=[{id:'none',n:'Nada',p:0},{id:'bow',n:'Lazo',p:15},{id:'frog',n:'Rana',p:30},{id:'crown',n:'Corona',p:60},{id:'flower',n:'Flor',p:20}];
const BGS=[{id:0,n:'Cuarto',p:0},{id:1,n:'Jardín',p:25},{id:2,n:'Noche',p:40},{id:3,n:'Sueño',p:50}];
const now=Date.now();
let P=OS.load('pet',null)||{name:'Mochi',hunger:70,joy:80,energy:75,clean:85,coins:10,xp:0,lvl:1,hat:'none',bg:0,own:['none',0],t:now,sleeping:false};
// decay while away (gentle, capped)
(function(){const h=Math.min(24,(now-P.t)/36e5);['hunger','joy','clean'].forEach(k=>P[k]=Math.max(15,P[k]-h*4));P.energy=P.sleeping?Math.min(100,P.energy+h*20):Math.max(15,P.energy-h*3);P.t=now})();
function save(){P.t=Date.now();OS.save('pet',P)}
function mood(){const avg=(P.hunger+P.joy+P.energy+P.clean)/4;return P.sleeping?'sleep':avg>70?'happy':avg>45?'ok':'sad'}
function petSVG(){const m=mood();const col=P.lvl>=6?'#ffe3ef':P.lvl>=3?'#fff0f5':'#ffffff';const eyes=m==='sleep'?'<path d="M68 92 q8 6 16 0M116 92 q8 6 16 0" stroke="#5b3a3a" stroke-width="4" fill="none" stroke-linecap="round"/>':`<g class="eyes"><ellipse cx="76" cy="92" rx="7" ry="${m==='sad'?6:9}" fill="#5b3a3a"/><ellipse cx="124" cy="92" rx="7" ry="${m==='sad'?6:9}" fill="#5b3a3a"/><circle cx="78" cy="88" r="2.6" fill="#fff"/><circle cx="126" cy="88" r="2.6" fill="#fff"/><animate attributeName="opacity" values="1;1;0;1" keyTimes="0;.94;.97;1" dur="4s" repeatCount="indefinite"/></g>`;
 const mouth=m==='happy'?'<path d="M92 108 q8 10 16 0" stroke="#5b3a3a" stroke-width="4" fill="#ff8aa6" stroke-linecap="round"/>':m==='sad'?'<path d="M92 114 q8 -8 16 0" stroke="#5b3a3a" stroke-width="4" fill="none" stroke-linecap="round"/>':m==='sleep'?'<ellipse cx="100" cy="112" rx="4" ry="3" fill="#5b3a3a"/>':'<path d="M93 110 h14" stroke="#5b3a3a" stroke-width="4" stroke-linecap="round"/>';
 const hat={none:'',bow:'<path d="M100 40 l-22 -12 v24z M100 40 l22 -12 v24z" fill="#ff6b8b" stroke="#5b3a3a" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="40" r="7" fill="#ff6b8b" stroke="#5b3a3a" stroke-width="3"/>',frog:'<ellipse cx="100" cy="42" rx="42" ry="16" fill="#8fd694" stroke="#5b3a3a" stroke-width="3"/><circle cx="78" cy="30" r="12" fill="#8fd694" stroke="#5b3a3a" stroke-width="3"/><circle cx="122" cy="30" r="12" fill="#8fd694" stroke="#5b3a3a" stroke-width="3"/><circle cx="78" cy="30" r="5" fill="#5b3a3a"/><circle cx="122" cy="30" r="5" fill="#5b3a3a"/>',crown:'<path d="M72 46 l6 -26 14 14 8 -18 8 18 14 -14 6 26z" fill="#ffd166" stroke="#5b3a3a" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="36" r="4" fill="#ff6b8b"/>',flower:'<g transform="translate(138 42)">'+[0,72,144,216,288].map(a=>`<ellipse rx="8" ry="13" fill="#fff" stroke="#5b3a3a" stroke-width="2.5" transform="rotate(${a}) translate(0 -11)"/>`).join('')+'<circle r="7" fill="#ffd166" stroke="#5b3a3a" stroke-width="2.5"/></g>'}[P.hat];
 return`<ellipse cx="100" cy="182" rx="70" ry="8" fill="rgba(91,58,58,.12)"/><g class="body"><path d="M100 36 C152 36 184 80 184 128 C184 166 150 180 100 180 C50 180 16 166 16 128 C16 80 48 36 100 36Z" fill="${col}" stroke="#5b3a3a" stroke-width="5"/>${P.lvl>=3?'<path d="M40 150 q60 20 120 0" stroke="#ffc2d1" stroke-width="6" fill="none" stroke-linecap="round" opacity=".7"/>':''}<ellipse cx="58" cy="112" rx="12" ry="7" fill="#ffb3c6" opacity=".8"/><ellipse cx="142" cy="112" rx="12" ry="7" fill="#ffb3c6" opacity=".8"/>${eyes}${mouth}${hat}${P.clean<35?'<g fill="#9a7b6b" opacity=".5"><circle cx="60" cy="140" r="5"/><circle cx="140" cy="150" r="4"/><circle cx="120" cy="60" r="3"/></g>':''}</g>${m==='sleep'?'<text x="160" y="40" font-family="Mochiy Pop One" font-size="22" fill="#5b3a3a">z<tspan dy="-12" font-size="16">z</tspan></text>':''}`}
const SAY={happy:['¡Te quiero mucho!','¡Hoy es un día genial!','¿Me haces cosquillas?','¡Soy el mochi más feliz!'],ok:['Estoy bien… ¿jugamos?','Me apetece algo dulce.','¿Qué hacemos hoy?'],sad:['Me siento un poco triste…','¿Me cuidas?','Necesito mimos.'],sleep:['Zzz… soñando con fresas…']};
function need(){return 40+P.lvl*30}
function render(){document.getElementById('petsvg').innerHTML=petSVG();document.getElementById('room').className='room bg'+P.bg+(P.sleeping?' night':'');document.getElementById('coins').textContent=P.coins;document.getElementById('pname').textContent=P.name;document.getElementById('plv').textContent=P.lvl;
 const S=[['Hambre','hunger','#ffd166'],['Alegría','joy','#ff9eb5'],['Energía','energy','#cdb4f6'],['Limpieza','clean','#8fe0cf']];document.getElementById('stats').innerHTML=S.map(([n,k,c])=>`<div class="stat"><span>${n}</span><div class="meter"><i style="width:${P[k]}%;background:${c}"></i></div><span>${Math.round(P[k])}</span></div>`).join('');
 document.getElementById('xpT').textContent=`${P.xp}/${need()}`;document.getElementById('xpb').style.width=P.xp/need()*100+'%';document.getElementById('sleep').textContent=P.sleeping?'Despertar':'Dormir';
 const sh=document.getElementById('shop');sh.innerHTML='';HATS.forEach(h=>sh.appendChild(item('hat',h)));BGS.forEach(b=>sh.appendChild(item('bg',b)))}
function item(kind,it){const own=P.own.includes(it.id);const on=kind==='hat'?P.hat===it.id:P.bg===it.id;const b=document.createElement('button');b.className='shopi'+(on?' on':'');
 const ico=kind==='bg'?`<svg viewBox="0 0 34 28"><rect width="34" height="17" rx="4" fill="${['#fff3ea','#c9f2ff','#2b2d5c','#ffe4f3'][it.id]}"/><rect y="17" width="34" height="11" rx="3" fill="${['#ffc9b5','#9fe3a8','#f2d6a2','#cdb4f6'][it.id]}"/></svg>`:`<svg viewBox="0 0 34 28">${{none:'<circle cx="17" cy="14" r="9" fill="none" stroke="#e5cfc6" stroke-width="3"/><path d="M11 20 23 8" stroke="#e5cfc6" stroke-width="3"/>',bow:'<path d="M17 14 l-10 -6 v12z M17 14 l10 -6 v12z" fill="#ff6b8b"/><circle cx="17" cy="14" r="4" fill="#ff6b8b"/>',frog:'<ellipse cx="17" cy="18" rx="14" ry="7" fill="#8fd694"/><circle cx="10" cy="11" r="5" fill="#8fd694"/><circle cx="24" cy="11" r="5" fill="#8fd694"/>',crown:'<path d="M5 22 l3 -14 6 6 3 -8 3 8 6 -6 3 14z" fill="#ffd166"/>',flower:'<circle cx="17" cy="14" r="10" fill="#fff" stroke="#e5cfc6"/><circle cx="17" cy="14" r="4" fill="#ffd166"/>'}[it.id]}</svg>`;
 b.innerHTML=`${ico}${it.n}${own?'':`<span class="pr">${it.p} ¢</span>`}`;b.onclick=()=>{if(!own){if(P.coins<it.p){say('¡Faltan monedas! Juega conmigo para ganar más.');return}P.coins-=it.p;P.own.push(it.id);OS.xp(10,'Compraste '+it.n+' para '+P.name);if(P.own.length>=HATS.length+BGS.length)OS.achieve('mochi_shop','Mochi fashionista','Compraste todo en la tienda de Mochi')}if(kind==='hat')P.hat=it.id;else P.bg=it.id;hop();say(kind==='hat'?'¿Qué tal me queda?':'¡Me encanta este sitio!');save();render()};return b}
let bt;function say(t){const b=document.getElementById('bubble');b.textContent=t;b.style.opacity=1;clearTimeout(bt);bt=setTimeout(()=>b.style.opacity=.0,3800)}
function fx(ch,x,y){const r=document.getElementById('room');const d=document.createElement('div');d.className='fx';d.textContent=ch;d.style.left=(x??50+Math.random()*20-10)+'%';d.style.top=(y??45)+'%';r.appendChild(d);setTimeout(()=>d.remove(),1200)}
function love(n){P.xp+=n;if(P.xp>=need()){P.xp-=need();P.lvl++;say(`¡He crecido! Ahora soy nivel ${P.lvl}.`);OS.xp(25,P.name+' sube a nivel '+P.lvl);for(let i=0;i<6;i++)setTimeout(()=>fx('✨'),i*120);if(P.lvl===3)OS.achieve('mochi_evo','Primera evolución',P.name+' evolucionó');if(P.lvl===6)OS.achieve('mochi_evo2','Mochi radiante',P.name+' alcanzó su forma final')}}
function hop(){const p=document.getElementById('pet');p.classList.remove('hop');void p.offsetWidth;p.classList.add('hop')}
function awake(){if(P.sleeping){say('Zzz… (está dormido)');return false}return true}
let pets=0;document.getElementById('pet').onclick=()=>{const p=document.getElementById('pet');p.classList.remove('squish');void p.offsetWidth;p.classList.add('squish');fx('♥');tone(700+Math.random()*300,.12);if(P.sleeping)return;pets++;P.joy=Math.min(100,P.joy+3);love(1);if(pets%5===0)say(SAY[mood()][Math.random()*SAY[mood()].length|0]);if(pets===20)OS.achieve('mochi_pet','Achuchón','Acariciaste a tu Mochi 20 veces');save();render()};
document.getElementById('feed').onclick=()=>{if(!awake())return;const f=document.getElementById('food');f.hidden=!f.hidden};
document.querySelectorAll('#food button').forEach(b=>b.onclick=()=>{const F=[{n:'onigiri',c:0,h:18,j:2},{n:'fresa',c:3,h:14,j:10},{n:'pastel',c:8,h:30,j:20}][+b.dataset.f];if(P.coins<F.c){say('¡No tenemos monedas para eso!');return}if(P.hunger>=98){say('¡Estoy llenísimo!');return}P.coins-=F.c;P.hunger=Math.min(100,P.hunger+F.h);P.joy=Math.min(100,P.joy+F.j);love(4);fx(['🍙','🍓','🍰'][+b.dataset.f]);say(`¡Ñam! Me encanta el ${F.n}.`);hop();OS.xp(3,'Diste de comer a '+P.name);document.getElementById('food').hidden=true;save();render()});
document.getElementById('sleep').onclick=()=>{P.sleeping=!P.sleeping;if(!P.sleeping){P.energy=Math.min(100,P.energy+25);say('¡Buenos días! Qué bien he dormido.');love(3)}else say('Buenas noches…');save();render()};
document.getElementById('bath').onclick=()=>{if(!awake())return;P.clean=100;P.joy=Math.min(100,P.joy+5);love(3);for(let i=0;i<8;i++)setTimeout(()=>fx('🫧',30+Math.random()*40,40+Math.random()*30),i*90);say('¡Brillo como una perla!');OS.xp(3,'Bañaste a '+P.name);save();render()};
document.getElementById('play').onclick=()=>{if(!awake())return;if(P.energy<15){say('Estoy muy cansado… déjame dormir.');return}startGame()};
// mini game
const gc=document.getElementById('gc'),g=gc.getContext('2d');let G;
function startGame(){document.getElementById('game').hidden=false;G={x:240,items:[],score:0,t:20,lives:3,last:performance.now(),spawn:0};requestAnimationFrame(gloop)}
gc.addEventListener('pointermove',e=>{if(!G)return;const r=gc.getBoundingClientRect();G.x=(e.clientX-r.left)/r.width*480});
addEventListener('keydown',e=>{if(!G)return;if(e.key==='ArrowLeft')G.x-=30;if(e.key==='ArrowRight')G.x+=30});
function gloop(n){if(!G)return;const dt=Math.max(0,Math.min(.05,(n-G.last)/1000));G.last=n;G.t-=dt;G.spawn-=dt;if(G.spawn<=0){G.spawn=.45;const r=Math.random();G.items.push({x:30+Math.random()*420,y:-20,k:r<.2?'cloud':r<.35?'candy':'star',v:160+Math.random()*120+ (20-G.t)*8})}
 g.clearRect(0,0,480,640);g.fillStyle='#ffd9c7';g.fillRect(0,580,480,60);
 for(const it of G.items){it.y+=it.v*dt;g.font='34px sans-serif';g.textAlign='center';g.fillText(it.k==='star'?'⭐':it.k==='candy'?'🍬':'⛈️',it.x,it.y);if(it.y>520&&it.y<600&&Math.abs(it.x-G.x)<52&&!it.got){it.got=1;if(it.k==='cloud'){G.lives--;tone(150,.2)}else{G.score+=it.k==='candy'?3:1;tone(900+G.score*10,.08)}}}
 G.items=G.items.filter(i=>i.y<700&&!i.got);G.x=Math.max(40,Math.min(440,G.x));
 // mini mochi
 g.fillStyle='#fff';g.strokeStyle='#5b3a3a';g.lineWidth=4;g.beginPath();g.ellipse(G.x,560,46,36,0,0,7);g.fill();g.stroke();g.fillStyle='#5b3a3a';g.beginPath();g.arc(G.x-14,552,4,0,7);g.arc(G.x+14,552,4,0,7);g.fill();g.fillStyle='#ffb3c6';g.beginPath();g.ellipse(G.x-26,564,7,4,0,0,7);g.ellipse(G.x+26,564,7,4,0,0,7);g.fill();
 document.getElementById('gs').textContent=G.score;document.getElementById('gt').textContent=Math.max(0,Math.ceil(G.t));document.getElementById('gl').textContent=G.lives;
 if(G.t<=0||G.lives<=0){const s=G.score;G=null;document.getElementById('game').hidden=true;P.coins+=s;P.joy=Math.min(100,P.joy+15);P.energy=Math.max(0,P.energy-12);P.hunger=Math.max(0,P.hunger-6);love(6);say(`¡Qué divertido! Ganamos ${s} monedas.`);OS.xp(Math.max(5,s),'Minijuego con '+P.name);if(s>=30)OS.achieve('mochi_30','Lluvia de estrellas','30 puntos en el minijuego de Mochi');save();render();return}
 requestAnimationFrame(gloop)}
document.getElementById('pname').ondblclick=()=>{const b=document.getElementById('pname');b.contentEditable=true;b.focus();b.onblur=()=>{b.contentEditable=false;P.name=(b.textContent.trim()||'Mochi').slice(0,14);save();render()};b.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();b.blur()}}};
let ac;function tone(f,d){try{ac=ac||new AudioContext();const o=ac.createOscillator(),gn=ac.createGain();o.type='sine';o.frequency.value=f;gn.gain.value=.06;gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(gn).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
setInterval(()=>{if(P.sleeping){P.energy=Math.min(100,P.energy+2)}else{P.hunger=Math.max(0,P.hunger-.6);P.joy=Math.max(0,P.joy-.4);P.energy=Math.max(0,P.energy-.3);P.clean=Math.max(0,P.clean-.3)}save();render()},20000);
render();say(SAY[mood()][0]+' (doble clic en mi nombre para cambiarlo)');
