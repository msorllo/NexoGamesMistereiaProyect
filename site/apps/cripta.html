<!doctype html>
<html lang="es" data-app="cripta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Cripta</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--stone:#1a1512;--torch:#ff8a2a;--ember:#c2410c;--bone:#eadbc0;--moss:#6b7a4a;--blood:#8b1e1e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0907;color:var(--bone);font-family:'Crimson Pro',Georgia,serif;overflow:hidden;user-select:none}
#view{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.75) 100%)}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 18px;gap:12px;pointer-events:none;align-items:flex-start}
.plate{background:linear-gradient(#2a211b,#17110d);border:1px solid #4a3a2c;box-shadow:inset 0 0 0 3px #120d0a,0 4px 14px rgba(0,0,0,.6);padding:8px 14px;font-size:15px}
.plate b{font-family:'Pirata One',serif;font-size:24px;color:var(--torch);font-weight:400;letter-spacing:.02em;margin-right:6px}
.keys{display:flex;gap:6px;margin-top:4px}
.keys svg{width:22px;height:22px;opacity:.25}.keys svg.got{opacity:1;filter:drop-shadow(0 0 4px #ffc85a)}
#mini{position:fixed;right:18px;bottom:18px;border:1px solid #4a3a2c;box-shadow:0 0 0 3px #120d0a;opacity:.85;image-rendering:pixelated;width:150px;height:150px;background:#0b0907}
.pad{position:fixed;left:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px}
.pad button{background:rgba(26,21,18,.75);border:1px solid #4a3a2c;color:var(--bone);font-size:22px;border-radius:6px;touch-action:none}
.pad button:active{background:#3a2a1e}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(60,30,10,.7),rgba(8,6,5,.96));z-index:5;padding:16px}
.screen[hidden]{display:none}
.tome{max-width:480px;text-align:center}
.tome h1{font-family:'Pirata One',serif;font-weight:400;font-size:clamp(54px,12vw,96px);margin:0;line-height:.9;color:var(--bone);text-shadow:0 0 30px rgba(255,138,42,.5),0 4px 0 #3a1a08}
.tome .sub{font-style:italic;font-size:19px;color:#c9b38e;margin:10px 0 20px}
.tome p{font-size:16px;line-height:1.5;color:#bfae90;margin:0 0 20px}
.btn{font-family:'Pirata One',serif;font-size:26px;background:linear-gradient(#ff9a3c,#c2410c);color:#1a0c04;border:0;padding:10px 34px;cursor:pointer;box-shadow:0 0 24px rgba(255,138,42,.45),inset 0 -3px 0 rgba(0,0,0,.3);border-radius:3px}
.btn:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
.levels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 20px}
.levels span{width:44px;height:52px;border:1px solid #4a3a2c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Pirata One',Georgia,serif;font-size:20px;background:#17110d}
.levels span i{font-style:normal;font-size:10px;color:var(--torch);letter-spacing:1px}
.levels span.lock{opacity:.35}
.msg{position:fixed;left:0;right:0;top:30%;text-align:center;font-family:'Pirata One',Georgia,serif;font-size:clamp(30px,6vw,52px);color:#ffd28a;text-shadow:0 0 20px #ff8a2a,0 3px 0 #000;opacity:0;transition:opacity .5s;pointer-events:none}
.msg.on{opacity:1}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
</style>
</head>
<body>
<canvas id="view" width="320" height="200"></canvas>
<div class="vig"></div>
<div class="hud">
  <div class="plate"><b id="lvl">Nivel 1</b><span id="time">0:00</span><div class="keys" id="keys"></div></div>
  <div class="plate" style="text-align:right"><b id="score">0</b>almas<div style="font-size:13px;font-style:italic;color:#bfae90" id="goal">Encuentra las llaves</div></div>
</div>
<canvas id="mini" width="31" height="31"></canvas>
<div class="pad"><button class="u" data-k="w">▲</button><button class="l" data-k="a">◀</button><button class="d" data-k="s">▼</button><button class="r" data-k="d">▶</button></div>
<div class="msg" id="msg"></div>
<div class="screen" id="menu"><div class="tome">
  <h1>La Cripta</h1>
  <div class="sub">Siete sótanos. Una antorcha. Ninguna salida fácil.</div>
  <div class="levels" id="lvls"></div>
  <p>Recoge todas las llaves doradas para abrir la puerta sellada de cada nivel. Cuanto antes escapes, más almas liberas.<br><small>WASD / flechas para moverte · arrastra el ratón para girar · M: mapa</small></p>
  <button class="btn" id="go">Descender</button>
</div></div>
<script>
const cv=document.getElementById('view'),ctx=cv.getContext('2d');const RW=320,RH=200;let img=ctx.createImageData(RW,RH),buf=new Uint32Array(img.data.buffer);
function fit(){const a=innerWidth/innerHeight;let w,h;if(a>=1){h=200;w=Math.round(200*a)}else{w=240;h=Math.round(240/a)}cv.width=w;cv.height=h;img=ctx.createImageData(w,h);buf=new Uint32Array(img.data.buffer)}fit();addEventListener('resize',fit);
// textures 64x64 as Uint32 ABGR
function tex(fn){const t=new Uint32Array(64*64);for(let y=0;y<64;y++)for(let x=0;x<64;x++){const [r,g,b]=fn(x,y);t[y*64+x]=(255<<24)|(b<<16)|(g<<8)|r}return t}
const rnd=(x,y,s=1)=>{const n=Math.sin(x*127.1+y*311.7+s*74.7)*43758.5453;return n-Math.floor(n)};
const STONE=tex((x,y)=>{const row=Math.floor(y/16),off=row%2?16:0,bx=(x+off)%32,by=y%16;const mortar=bx<2||by<2;const n=rnd(Math.floor((x+off)/32),row)*30+rnd(x,y)*22;if(mortar)return[40,34,30];const moss=rnd(x>>2,y>>2,3)>.86&&y>40;return moss?[62+n*.4|0,70+n*.5|0,44]:[92+n|0,80+n|0,70+n*.8|0]});
const DOOR=tex((x,y)=>{const plank=Math.floor(x/11);const n=rnd(plank,y>>3)*18+rnd(x,y)*14;const band=(y>10&&y<15)||(y>48&&y<53);const edge=x<3||x>60||y<3;if(edge)return[48,36,26];if(band)return[70+n|0,66+n|0,62+n|0];if(x>44&&x<50&&y>28&&y<36)return[200,160,60];return[110+n|0,64+n*.6|0,30]});
const OPEN=tex((x,y)=>{const d=Math.hypot(x-32,y-36)/40;const edge=x<3||x>60||y<3;if(edge)return[48,36,26];return[255*Math.max(0,1-d)|0,180*Math.max(0,1-d*1.1)|0,80*Math.max(0,1-d*1.3)|0]});
const FLOOR=tex((x,y)=>{const e=(x%32<1)||(y%32<1);const n=rnd(x>>5,y>>5,7)*20+rnd(x,y,2)*16;return e?[30,24,20]:[58+n|0,50+n|0,44+n|0]});
const KEY=(()=>{const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');g.strokeStyle='#ffcf5a';g.fillStyle='#ffcf5a';g.lineWidth=3;g.beginPath();g.arc(10,16,6,0,7);g.stroke();g.fillRect(15,15,14,3);g.fillRect(24,18,3,5);g.fillRect(19,18,3,4);return new Uint32Array(g.getImageData(0,0,32,32).data.buffer)})();
let map,N,px,py,dir,keys,got,exit,level=1,t0,score=OS.load('souls',0),best=OS.load('best',{}),unlocked=OS.load('unlocked',1),state='menu',showMini=true;
function gen(lv){const n=4+lv*2;N=n*2+1;map=Array.from({length:N},()=>Array(N).fill(1));const st=[[1,1]];map[1][1]=0;
 while(st.length){const [x,y]=st[st.length-1];const nb=[[2,0],[-2,0],[0,2],[0,-2]].map(([dx,dy])=>[x+dx,y+dy,dx,dy]).filter(([a,b])=>a>0&&b>0&&a<N-1&&b<N-1&&map[b][a]===1);if(!nb.length){st.pop();continue}const [a,b,dx,dy]=nb[Math.random()*nb.length|0];map[y+dy/2][x+dx/2]=0;map[b][a]=0;st.push([a,b])}
 // extra loops
 for(let i=0;i<n;i++){const x=1+2*(Math.random()*(n-1)|0)+1,y=1+2*(Math.random()*n|0);if(x<N-1&&map[y]&&map[y][x]===1)map[y][x]=0}
 // BFS distances
 const dist=Array.from({length:N},()=>Array(N).fill(-1));const q=[[1,1]];dist[1][1]=0;while(q.length){const [x,y]=q.shift();for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy;if(map[b][a]===0&&dist[b][a]<0){dist[b][a]=dist[y][x]+1;q.push([a,b])}}}
 const cells=[];for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++)if(map[y][x]===0){const w=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>map[y+dy][x+dx]!==0).length;cells.push({x,y,d:dist[y][x],dead:w===3})}
 cells.sort((a,b)=>b.d-a.d);const far=cells[0];
 // exit: wall adjacent to far cell
 for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){if(map[far.y+dy][far.x+dx]===1){exit={x:far.x+dx,y:far.y+dy};map[exit.y][exit.x]=2;break}}
 const nk=Math.min(5,1+Math.ceil(lv/1.5));const pool=cells.filter(c=>c.dead&&c!==far&&c.d>3);keys=[];for(let i=0;i<nk;i++){const c=pool.length?pool.splice((Math.random()*Math.min(pool.length,6))|0,1)[0]:cells[(i+1)*3];keys.push({x:c.x+.5,y:c.y+.5,got:false})}
 got=0;px=1.5;py=1.5;dir=map[1][2]===0?0:Math.PI/2;t0=performance.now();
 document.getElementById('keys').innerHTML=keys.map(()=>'<svg viewBox="0 0 24 24"><circle cx="7" cy="12" r="4" fill="none" stroke="#ffcf5a" stroke-width="2.4"/><path d="M11 12h11M18 12v4M15 12v3" stroke="#ffcf5a" stroke-width="2.4"/></svg>').join('');
 document.getElementById('lvl').textContent='Nivel '+lv;document.getElementById('goal').textContent='Encuentra '+nk+' llaves';
 const m=document.getElementById('mini');m.width=m.height=N}
const K={};addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='m')showMini=!showMini});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
const kmap={arrowup:'w',arrowdown:'s',arrowleft:'a',arrowright:'d'};
document.querySelectorAll('.pad button').forEach(b=>{b.addEventListener('pointerdown',e=>{K[b.dataset.k]=1;e.preventDefault()});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>K[b.dataset.k]=0))});
let mdrag=null;cv.addEventListener('pointerdown',e=>{mdrag=e.clientX});addEventListener('pointerup',()=>mdrag=null);addEventListener('pointermove',e=>{if(mdrag!=null&&state==='play'){dir+=(e.clientX-mdrag)*.006;mdrag=e.clientX}});
const k=n=>K[n]||Object.entries(kmap).some(([a,b])=>b===n&&K[a]);
function free(x,y){const c=map[y|0][x|0];return c===0||(c===2&&got===keys.length&&false)}
function update(dt){if(state!=='play')return;dir+=((k('d')?1:0)-(k('a')?1:0))*dt*2.6;const sp=((k('w')?1:0)-(k('s')?1:0))*dt*3;
 const nx=px+Math.cos(dir)*sp,ny=py+Math.sin(dir)*sp,r=.22;
 if(free(nx+Math.sign(nx-px)*r,py))px=nx;if(free(px,ny+Math.sign(ny-py)*r))py=ny;
 for(const kk of keys){if(!kk.got&&Math.hypot(kk.x-px,kk.y-py)<.45){kk.got=true;got++;flash(got===keys.length?'¡La puerta se abre!':'Llave '+got+' de '+keys.length);tone(880,.15);tone(1320,.2);document.querySelectorAll('.keys svg')[got-1].classList.add('got');document.getElementById('goal').textContent=got===keys.length?'Busca la puerta de luz':'Faltan '+(keys.length-got)}}
 if(got===keys.length&&Math.hypot(exit.x+.5-px,exit.y+.5-py)<1.05)win();
 const s=(performance.now()-t0)/1000;document.getElementById('time').textContent=Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
let ac;function tone(f,d){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
let mt;function flash(t){const m=document.getElementById('msg');m.textContent=t;m.classList.add('on');clearTimeout(mt);mt=setTimeout(()=>m.classList.remove('on'),1500)}
function win(){state='menu';const s=(performance.now()-t0)/1000;const par=20+level*18;const stars=s<par?3:s<par*1.6?2:1;const gain=Math.round(100*level*stars/2);score+=gain;OS.save('souls',score);
 best[level]=Math.max(best[level]||0,stars);OS.save('best',best);if(level+1>unlocked&&level<7){unlocked=level+1;OS.save('unlocked',unlocked)}
 OS.xp(20+level*10+stars*5,'Escapaste del nivel '+level);if(stars===3)OS.achieve('cripta_3','Sombra veloz','3 estrellas en un nivel de La Cripta');if(level>=7)OS.achieve('cripta_7','Señor de la Cripta','Escapaste del séptimo sótano');
 tone(523,.2);setTimeout(()=>tone(659,.2),150);setTimeout(()=>tone(784,.4),300);
 document.querySelector('.tome h1').textContent='¡Libre!';document.querySelector('.tome .sub').textContent=`Nivel ${level} en ${Math.round(s)} s · ${'★'.repeat(stars)}${'☆'.repeat(3-stars)} · +${gain} almas`;level=Math.min(7,level+1);document.getElementById('go').textContent='Siguiente sótano';renderLvls();document.getElementById('menu').hidden=false}
function renderLvls(){document.getElementById('lvls').innerHTML=[1,2,3,4,5,6,7].map(l=>`<span class="${l>unlocked?'lock':''}" data-l="${l}" style="${l===level?'border-color:#ff8a2a':''};cursor:${l<=unlocked?'pointer':'default'}">${l}<i>${best[l]?'★'.repeat(best[l]):l>unlocked?'🔒':''}</i></span>`).join('');document.querySelectorAll('#lvls span').forEach(s=>s.onclick=()=>{const l=+s.dataset.l;if(l<=unlocked){level=l;renderLvls()}})}
document.getElementById('go').onclick=()=>{gen(level);state='play';document.getElementById('menu').hidden=true;flash('Nivel '+level)};
const zb=new Float32Array(4000);
function render(){const w=cv.width,h=cv.height;if(!map){gen(1)}
 const fl=.92+Math.sin(performance.now()/90)*.04+Math.sin(performance.now()/37)*.03;
 const dx=Math.cos(dir),dy=Math.sin(dir),fov=.66*(w/h)/1.6,plx=-dy*fov,ply=dx*fov;
 // floor & ceiling
 for(let y=h/2+1;y<h;y++){const rd=(h/2)/(y-h/2);const lx0=dx-plx,ly0=dy-ply,lx1=dx+plx,ly1=dy+ply;let fx=px+rd*lx0,fy=py+rd*ly0;const sx=rd*(lx1-lx0)/w,sy=rd*(ly1-ly0)/w;const sh=Math.min(1,fl*1.1/(1+rd*rd*.14));
  for(let x=0;x<w;x++){const tx=(fx*64&63),ty=(fy*64&63);fx+=sx;fy+=sy;const c=FLOOR[ty*64+tx];buf[y*w+x]=shade(c,sh);const cy=h-y-1;buf[cy*w+x]=shade(0xff1a1412,sh*.5+.05)}}
 for(let x=0;x<w;x++){const cam=2*x/w-1,rx=dx+plx*cam,ry=dy+ply*cam;let mx=px|0,my=py|0;const ddx=Math.abs(1/rx),ddy=Math.abs(1/ry);let stx,sty,sdx,sdy,side,hit=0;
  if(rx<0){stx=-1;sdx=(px-mx)*ddx}else{stx=1;sdx=(mx+1-px)*ddx}if(ry<0){sty=-1;sdy=(py-my)*ddy}else{sty=1;sdy=(my+1-py)*ddy}
  let guard=0;while(!hit&&guard++<80){if(sdx<sdy){sdx+=ddx;mx+=stx;side=0}else{sdy+=ddy;my+=sty;side=1}if(map[my]&&map[my][mx]>0)hit=map[my][mx]}
  const pd=side===0?(sdx-ddx):(sdy-ddy);zb[x]=pd;const lh=Math.floor(h/pd);const ds=Math.max(0,(-lh/2+h/2)|0),de=Math.min(h-1,(lh/2+h/2)|0);
  let wx=side===0?py+pd*ry:px+pd*rx;wx-=Math.floor(wx);let tx=(wx*64)|0;if(side===0&&rx>0||side===1&&ry<0)tx=63-tx;
  const T=hit===2?(got===keys.length?OPEN:DOOR):STONE;const sh=Math.min(1,fl*1.15/(1+pd*pd*.14))*(side?.78:1);const glow=hit===2&&got===keys.length;
  const step=64/lh;let tp=(ds-h/2+lh/2)*step;for(let y=ds;y<=de;y++){const ty=(tp|0)&63;tp+=step;buf[y*w+x]=glow?T[ty*64+tx]:shade(T[ty*64+tx],sh)}}
 // sprites
 const sp=keys.filter(k=>!k.got).map(k=>({...k,d:(k.x-px)**2+(k.y-py)**2})).sort((a,b)=>b.d-a.d);const inv=1/(plx*dy-dx*ply);
 for(const s of sp){const sx=s.x-px,sy=s.y-py;const tx=inv*(dy*sx-dx*sy),ty=inv*(-ply*sx+plx*sy);if(ty<=.1)continue;const scx=(w/2)*(1+tx/ty);const bob=Math.sin(performance.now()/300+s.x)*h*.04/ty;const sz=Math.abs(h/ty)*.5;const y0=(h/2+sz*.3+bob-sz/2)|0;
  for(let x=(scx-sz/2)|0;x<scx+sz/2;x++){if(x<0||x>=w||ty>=zb[x])continue;const u=((x-(scx-sz/2))/sz*32)|0;for(let y=Math.max(0,y0);y<Math.min(h,y0+sz);y++){const v=((y-y0)/sz*32)|0;const c=KEY[v*32+u];if((c>>>24)>100)buf[y*w+x]=c}}
  // glow halo
 }
 ctx.putImageData(img,0,0);
 // torch vignette overlay tint
 const g=ctx.createRadialGradient(w/2,h*.6,h*.1,w/2,h*.55,w*.7);g.addColorStop(0,'rgba(255,140,40,.08)');g.addColorStop(1,'rgba(0,0,0,.35)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 // hand torch
 const tx=w*.66,ty=h*.9+Math.sin(performance.now()/160)*2;ctx.fillStyle='#3a2414';ctx.fillRect(tx-3,ty-14,6,40);const fg=ctx.createRadialGradient(tx,ty-20,1,tx,ty-20,16*fl);fg.addColorStop(0,'rgba(255,240,180,1)');fg.addColorStop(.4,'rgba(255,150,40,.85)');fg.addColorStop(1,'rgba(255,80,0,0)');ctx.fillStyle=fg;ctx.beginPath();ctx.ellipse(tx,ty-22,9*fl,16*fl,0,0,7);ctx.fill();
 mini();document.getElementById('score').textContent=score}
function shade(c,s){const r=c&255,g=(c>>8)&255,b=(c>>16)&255;return(255<<24)|(Math.min(255,b*s*.8)<<16)|(Math.min(255,g*s*.95)<<8)|Math.min(255,r*s*1.08)}
function mini(){const m=document.getElementById('mini');m.style.display=showMini?'block':'none';if(!showMini)return;const g=m.getContext('2d');g.fillStyle='#0b0907';g.fillRect(0,0,N,N);for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(map[y][x]===1){g.fillStyle='#3a2e24';g.fillRect(x,y,1,1)}if(map[y][x]===2){g.fillStyle=got===keys.length?'#ffcf5a':'#7a4a20';g.fillRect(x,y,1,1)}}
 for(const k of keys)if(!k.got&&Math.hypot(k.x-px,k.y-py)<6){g.fillStyle='#ffcf5a';g.fillRect(k.x|0,k.y|0,1,1)}g.fillStyle='#ff5a2a';g.fillRect(px|0,py|0,1,1)}
renderLvls();gen(level);
let last=performance.now();(function L(n){const dt=Math.max(0,Math.min(.05,(n-last)/1000));last=n;update(dt);if(state==='play'||!window._r){render();window._r=state!=='play'}requestAnimationFrame(L)})(last);
</script>
</body>
</html>
