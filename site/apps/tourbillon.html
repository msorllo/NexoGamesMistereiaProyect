<!doctype html>
<html lang="es" data-app="tourbillon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tourbillon</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f14;--bg2:#1b2230;--fg:#eef1f5;--acc:#3d6bff;--acc2:#7d9bff;--gold:#d6b36a;--ruby:#e0224f;--mut:#8a93a3;--glass:rgba(12,15,21,.66);--line:rgba(238,241,245,.11)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Sora',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#c.pt{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
.disp{font-family:'Michroma',Eurostile,'Arial Narrow',sans-serif;letter-spacing:.14em;text-transform:uppercase}
/* intro de UI escalonada */
.in{opacity:0;transform:translateY(10px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
.ready .in{opacity:1;transform:none}
.ready .d1{transition-delay:.15s}.ready .d2{transition-delay:.3s}.ready .d3{transition-delay:.45s}.ready .d4{transition-delay:.6s}
/* barra superior */
.top{position:fixed;left:0;right:0;top:0;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.brand{pointer-events:auto}
.logo{font-size:22px;line-height:1;display:flex;align-items:center;gap:10px}
.logo svg{width:26px;height:26px;color:var(--gold)}
.cal{display:flex;align-items:center;gap:6px;margin-top:12px}
.cal button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:rgba(255,255,255,.03);transition:background .2s,transform .2s}
.cal button:hover{background:rgba(255,255,255,.1)}.cal button:active{transform:scale(.92)}
.cal button:disabled{opacity:.25;cursor:not-allowed}
.cal svg{width:14px;height:14px}
.cal .nm{min-width:132px;text-align:center}
.cal .nm b{display:block;font-family:'Michroma',sans-serif;font-weight:400;font-size:13px;letter-spacing:.12em}
.cal .nm small{display:block;font-size:11px;color:var(--mut);letter-spacing:.08em;margin-top:3px}
.cal .st{color:var(--gold);font-size:11px;letter-spacing:2px;min-height:12px}
.tr{display:flex;gap:8px;pointer-events:auto;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{height:42px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;transition:background .2s,transform .2s,border-color .2s}
.chip:hover{background:rgba(255,255,255,.08)}.chip:active{transform:scale(.96)}
.chip svg{width:17px;height:17px}
.chip .g{color:var(--gold)}
.chip.day{border-color:rgba(61,107,255,.5)}
.chip.day .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.chip.day.done .dot{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.icon{width:42px;padding:0;justify-content:center}
/* mensaje de estado */
.msg{position:fixed;left:50%;top:22px;transform:translateX(-50%);max-width:min(460px,calc(100vw - 32px));text-align:center;font-size:13px;line-height:1.45;color:#cfd6e2;padding:10px 16px;border-radius:14px;pointer-events:none;transition:opacity .35s,transform .35s,border-color .3s,color .3s}
.msg.hide{opacity:0;transform:translate(-50%,-6px)}
.msg.bad{border-color:rgba(224,34,79,.55);color:#ffd5de}
.msg.good{border-color:rgba(214,179,106,.55);color:#f6e7c4}
.msg.warn{border-color:rgba(125,155,255,.55)}
/* base */
.dock{position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
.stats{pointer-events:auto;padding:12px 16px;display:flex;gap:20px}
.stats div{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.stats b{display:block;font-family:'Michroma',sans-serif;font-weight:400;font-size:20px;color:var(--fg);letter-spacing:.04em;margin-top:6px;font-variant-numeric:tabular-nums}
.stats b.bad{color:var(--ruby)}
.tray{pointer-events:auto;padding:8px;display:flex;gap:6px;align-items:stretch}
.gear{position:relative;width:86px;border-radius:13px;padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;transition:background .2s,border-color .2s,transform .15s,opacity .2s}
.gear:hover{background:rgba(255,255,255,.06)}
.gear:active{transform:scale(.95)}
.gear.on{background:rgba(61,107,255,.16);border-color:rgba(61,107,255,.6)}
.gear.none{opacity:.35}
.gear svg{width:40px;height:40px;color:var(--gold);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.gear.on svg{transform:rotate(30deg);color:#f0cf86}
.gear .l{font-size:10px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.gear .n{position:absolute;top:5px;right:7px;font-family:'Michroma',sans-serif;font-size:11px;color:var(--fg)}
.gear .n.z{color:var(--mut)}
.sep{width:1px;background:var(--line);margin:6px 4px}
.tool{width:50px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;transition:background .2s,transform .15s}
.tool:hover{background:rgba(255,255,255,.06);color:var(--fg)}.tool:active{transform:scale(.94)}
.tool svg{width:20px;height:20px}
.tool:disabled{opacity:.3}
/* victoria */
.win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .5s;padding:16px;background:radial-gradient(circle at 50% 50%,rgba(12,15,20,.2),rgba(12,15,20,.65))}
.win.on{opacity:1;pointer-events:auto}
.card{width:min(380px,100%);padding:28px 26px 24px;text-align:center;border-radius:26px;border-color:rgba(214,179,106,.35);box-shadow:0 40px 120px -30px rgba(0,0,0,.8),0 0 0 1px rgba(214,179,106,.08) inset;transform:translateY(16px) scale(.97);transition:transform .6s cubic-bezier(.2,.9,.2,1.1)}
.win.on .card{transform:none}
.card .k{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.card h2{font-family:'Michroma',sans-serif;font-weight:400;font-size:22px;letter-spacing:.1em;margin:12px 0 4px;text-transform:uppercase}
.card .stars{display:flex;justify-content:center;gap:10px;margin:18px 0 8px}
.card .stars svg{width:34px;height:34px;color:rgba(255,255,255,.12);transform:scale(.3) rotate(-40deg);opacity:0;transition:transform .6s cubic-bezier(.2,.9,.3,1.5),opacity .4s,color .3s}
.card .stars svg.on{color:var(--gold);filter:drop-shadow(0 0 10px rgba(214,179,106,.6))}
.card .stars svg.show{transform:none;opacity:1}
.card p{font-size:13px;color:#c3cad6;line-height:1.5;margin:8px 0 0}
.card .watch{display:flex;align-items:center;gap:12px;text-align:left;margin:18px 0 4px;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.card .watch .dl{width:44px;height:44px;flex:none}
.card .watch b{display:block;font-size:13px}.card .watch small{font-size:11px;color:var(--mut)}
.row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;height:46px;border-radius:13px;font-weight:600;font-size:14px;background:rgba(255,255,255,.08);transition:background .2s,transform .15s}
.btn:hover{background:rgba(255,255,255,.14)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:#fff;box-shadow:0 10px 30px -10px rgba(61,107,255,.8)}
.btn.pri:hover{background:#5a82ff}
/* vitrina */
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);padding:20px 20px 24px;border-radius:26px 0 0 26px;border-right:0;transform:translateX(105%);transition:transform .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px;z-index:5}
.sheet.on{transform:none}
.sh-h{display:flex;justify-content:space-between;align-items:center}
.sh-h h3{margin:0;font-family:'Michroma',sans-serif;font-weight:400;font-size:15px;letter-spacing:.2em;text-transform:uppercase}
.sh-h button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
.sh-h svg{width:16px;height:16px}
.comps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.comp{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:12px}
.comp b{display:block;font-size:12px;margin-bottom:6px}
.comp .bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.comp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.comp small{display:block;color:var(--mut);margin-top:6px;font-size:11px}
.comp.ok{border-color:rgba(214,179,106,.45)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;overflow:auto;padding-right:4px;flex:1;align-content:start}
.w{position:relative;padding:12px 6px 10px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .2s,transform .2s,border-color .2s}
.w:hover{background:rgba(255,255,255,.08);transform:translateY(-2px)}
.w.sel{border-color:var(--acc)}
.w .dl{width:62px;height:62px}
.w b{font-size:11px;font-weight:600;text-align:center;line-height:1.25}
.w small{font-size:10px;color:var(--gold);letter-spacing:2px;min-height:12px}
.w.lock .dl{filter:grayscale(1) brightness(.35)}
.w.lock b{color:var(--mut)}
.w .lk{position:absolute;top:30px;left:50%;transform:translateX(-50%);width:18px;height:18px;color:var(--mut)}
.sh-f{display:flex;gap:8px}
.sh-f .btn{height:44px}
/* cargando */
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 45%,#1b2230,#0c0f14 70%);z-index:50;transition:opacity .6s}
#load .disp{font-size:13px;color:#aab3c2}
#load svg{width:54px;height:54px;color:var(--gold);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:760px){
 .top{padding:12px 12px;flex-direction:column;align-items:stretch;gap:8px}
 .brand{display:flex;justify-content:space-between;align-items:center}
 .logo{font-size:15px}.logo svg{width:20px;height:20px}
 .cal{margin-top:0}.cal .nm{min-width:104px}.cal .nm b{font-size:11px}.cal button{width:32px;height:32px}
 .tr{justify-content:space-between;flex-wrap:nowrap}
 .chip{height:38px;padding:0 11px;font-size:12px}.icon{width:38px}
 .msg{top:auto;bottom:188px;font-size:12px}
 .dock{flex-direction:column;align-items:stretch;padding:10px 10px calc(10px + env(safe-area-inset-bottom));gap:8px}
 .stats{justify-content:space-around;padding:9px 12px}.stats b{font-size:16px;margin-top:4px}
 .tray{justify-content:space-between}.gear{flex:1;width:auto}.tool{width:46px}
 .sheet{top:auto;height:60vh;width:100vw;border-radius:26px 26px 0 0;border-bottom:0;border-right:1px solid var(--line);transform:translateY(105%)}
 .sheet.on{transform:none}
}
@media (max-width:380px){.gear svg{width:32px;height:32px}.chip .t{display:none}}
html.notr *{transition:none!important}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-star" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8l2.7 5.9 6.4.7-4.8 4.3 1.4 6.3L12 16.8 6.3 20l1.4-6.3L2.9 9.4l6.4-.7z"/></symbol>
 <symbol id="i-l" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
 <symbol id="i-r" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
 <symbol id="i-undo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 14L4 9l5-5"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 9h10a6 6 0 010 12h-3"/></symbol>
 <symbol id="i-reset" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></symbol>
 <symbol id="i-hint" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0012 3z"/></symbol>
 <symbol id="i-case" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M9 5.5L10 2h4l1 3.5M9 18.5L10 22h4l1-3.5M12 9v3l2 1.5"/></symbol>
 <symbol id="i-snd" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11"/></symbol>
 <symbol id="i-mute" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/></symbol>
 <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="2" d="M8 11V8a4 4 0 018 0v3"/></symbol>
</svg>
<canvas id="c" aria-label="Platina de reloj en 3D: toca los ejes para montar ruedas"></canvas>
<div id="load"><svg viewBox="0 0 64 64" aria-hidden="true"><path id="ldg" fill="currentColor"/></svg><div class="disp">Ajustando el calibre</div></div>

<header class="top">
 <div class="brand in">
  <div class="logo disp"><svg viewBox="0 0 64 64" aria-hidden="true"><path class="gp" fill="currentColor"/></svg>Tourbillon</div>
  <div class="cal">
   <button id="prev" aria-label="Calibre anterior"><svg><use href="#i-l"/></svg></button>
   <div class="nm"><b id="lname">Calibre 01</b><small id="city">Ginebra</small><div class="st" id="lstars"></div></div>
   <button id="next" aria-label="Calibre siguiente"><svg><use href="#i-r"/></svg></button>
  </div>
 </div>
 <div class="tr in d1">
  <div class="chip glass" title="Estrellas totales"><svg class="g"><use href="#i-star"/></svg><span id="tstars">0</span><span style="color:var(--mut)">/36</span></div>
  <button class="chip glass day" id="daily" aria-label="Calibre del día"><span class="dot"></span><span class="t">Del día</span><span id="streak" style="color:var(--mut)"></span></button>
  <button class="chip glass" id="vit" aria-label="Abrir la vitrina"><svg><use href="#i-case"/></svg><span class="t">Vitrina</span></button>
  <button class="chip glass icon" id="snd" aria-label="Sonido"><svg><use href="#i-snd"/></svg></button>
 </div>
</header>
<div class="msg glass hide" id="msg" role="status" aria-live="polite"></div>
<footer class="dock">
 <div class="stats glass in d2">
  <div>Colocaciones<b id="mv">0</b></div><div>Objetivo<b id="par">0</b></div><div>Choques<b id="col">0</b></div>
 </div>
 <div class="tray glass in d3" id="tray">
  <button class="gear" data-k="S" aria-label="Rueda pequeña, 12 dientes"><span class="n"></span><svg viewBox="0 0 64 64"><path class="gp" data-n="12" fill="currentColor"/></svg><span class="l">S · 12</span></button>
  <button class="gear" data-k="M" aria-label="Rueda mediana, 18 dientes"><span class="n"></span><svg viewBox="0 0 64 64"><path class="gp" data-n="18" fill="currentColor"/></svg><span class="l">M · 18</span></button>
  <button class="gear" data-k="L" aria-label="Rueda grande, 24 dientes"><span class="n"></span><svg viewBox="0 0 64 64"><path class="gp" data-n="24" fill="currentColor"/></svg><span class="l">L · 24</span></button>
  <span class="sep"></span>
  <button class="tool" id="hint" aria-label="Pista (máximo 2 estrellas)"><svg><use href="#i-hint"/></svg>Pista</button>
  <button class="tool" id="undo" aria-label="Deshacer"><svg><use href="#i-undo"/></svg>Atrás</button>
  <button class="tool" id="reset" aria-label="Reiniciar calibre"><svg><use href="#i-reset"/></svg>Borrar</button>
 </div>
</footer>
<div class="win" id="win">
 <div class="card glass">
  <div class="k" id="wk">Calibre superado</div>
  <h2 id="wt">Late el tiempo</h2>
  <div class="stars" id="ws"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
  <p id="wp"></p>
  <div class="watch" id="ww"></div>
  <div class="row"><button class="btn" id="wv">Ver en la vitrina</button><button class="btn pri" id="wn">Siguiente</button></div>
 </div>
</div>
<aside class="sheet glass" id="sheet" aria-label="Vitrina">
 <div class="sh-h"><h3>Vitrina</h3><button id="shx" aria-label="Cerrar vitrina"><svg><use href="#i-x"/></svg></button></div>
 <div class="comps" id="comps"></div>
 <div class="grid" id="grid"></div>
 <div class="sh-f"><button class="btn pri" id="shplay">Jugar este calibre</button></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>

 const nm=g.attributes.normal;if(nm&&!(nm.array instanceof Float32Array)&&!(nm.data&&nm.data.array instanceof Float32Array)){const f=new Float32Array(nm.count*3);for(let i=0;i<nm.count;i++){let x=nm.getX(i),y=nm.getY(i),z=nm.getZ(i);if(Math.abs(x)>1.001||Math.abs(y)>1.001||Math.abs(z)>1.001){x/=127;y/=127;z/=127}const l=Math.hypot(x,y,z)||1;f[i*3]=x/l;f[i*3+1]=y/l;f[i*3+2]=z/l}g.setAttribute('normal',new THREE.BufferAttribute(f,3))}

function openVit(i){closeWin();if(won&&winTimer){clearTimeout(winTimer);onWin(false)}mode='vit';vitSel=Math.max(0,Math.min(LV-1,i??S.lvl));if(!showcase)buildShowcase();buildWatch(vitSel);renderVit();$('sheet').classList.add('on');document.querySelectorAll('.top,.dock').forEach(e=>e.style.visibility='hidden');$('msg').classList.add('hide');
 const mob=innerWidth<760;camGo(SHOW.clone().add(mob?new THREE.Vector3(0,3.2,14):new THREE.Vector3(2.4,3.8,10.5)),SHOW.clone().add(mob?new THREE.Vector3(0,-.4,0):new THREE.Vector3(2.4,1.9,0)),1.4);sfx('whoosh')}
function closeVit(){$('sheet').classList.remove('on');document.querySelectorAll('.top,.dock').forEach(e=>e.style.visibility='');mode=lastMode;camHome(1.3);sfx('whoosh')}
let lastMode='lvl';$('vit').onclick=()=>{FX.audio();lastMode=mode;openVit(LVL?LVL.L:S.lvl)};$('shx').onclick=closeVit;
$('shplay').onclick=()=>{const i=vitSel;if(i>=S.unl){return}$('sheet').classList.remove('on');document.querySelectorAll('.top,.dock').forEach(e=>e.style.visibility='');S.lvl=i;save();lastMode='lvl';mode='lvl';build(i);camHome(1.3)};
function renderVit(){const tot=totalStars();
 $('comps').innerHTML=[['Fase lunar',18],['Jaula tourbillon',30]].map(([n,g])=>`<div class="comp ${tot>=g?'ok':''}"><b>${n}</b><div class="bar"><i style="width:${Math.min(100,tot/g*100)}%"></i></div><small>${tot>=g?'Desbloqueada':tot+' / '+g+' ★'}</small></div>`).join('');
 $('grid').innerHTML=WATCH.map((w,i)=>{const got=S.stars[i];const lock=!got;return`<button class="w ${lock?'lock':''} ${i===vitSel?'sel':''}" data-i="${i}" aria-label="Reloj ${w[0]}${lock?' (bloqueado)':''}"><svg class="dl" viewBox="0 0 64 64">${dialSVG(w[1])}</svg>${lock?'<svg class="lk"><use href="#i-lock"/></svg>':''}<b>${w[0]}</b><small>${got?'★'.repeat(got):'Calibre '+(i+1)}</small></button>`}).join('');
 $('grid').querySelectorAll('.w').forEach(b=>b.onclick=()=>{vitSel=+b.dataset.i;buildWatch(vitSel);if(!S.stars[vitSel]){watch.traverse(m=>{if(m.isMesh){m.material=m.material.clone();m.material.color.multiplyScalar(.15);m.material.userData.own=1}})}renderVit();sfx('sel')});
 const p=$('shplay');p.disabled=vitSel>=S.unl;p.textContent=vitSel>=S.unl?'Supera el calibre '+vitSel+' para abrirlo':(S.stars[vitSel]?'Rejugar calibre '+(vitSel+1):'Jugar calibre '+(vitSel+1))}

/* ---------- cámara ---------- */
function homePose(){const asp=innerWidth/innerHeight;const mob=innerWidth<760;const vf=camera.fov*Math.PI/180;const hf=2*Math.atan(Math.tan(vf/2)*asp);const need=5.9/Math.tan(Math.min(vf,hf)/2)*(mob?1.02:1.08);const d=Math.max(12,Math.min(30,need));const pol=mob?.34:.62;return{pos:new THREE.Vector3(0,Math.cos(pol)*d,Math.sin(pol)*d),tgt:new THREE.Vector3(mob?0:.6,mob?-.2:0,mob?.6:.7)}}
function camGo(pos,tgt,dur){controls.enabled=false;const c=camera.position,t=controls.target;const o={k:0};const p0=c.clone(),t0=t.clone();FX.tween(o,{k:1},dur,'inOut',()=>{controls.enabled=true});camTw=o;camFrom=[p0,t0,pos,tgt]}
let camTw=null,camFrom=null;function camHome(d=1.2){const h=homePose();camGo(h.pos,h.tgt,d)}
FX.onResize=()=>{camera.fov=innerWidth<760?44:36;camera.updateProjectionMatrix();if(mode!=='vit'&&!camTw){const h=homePose();camera.position.copy(h.pos);controls.target.copy(h.tgt)}};

/* ---------- bucle ---------- */
function frame(dt,t){
 if(camTw&&camFrom){const k=camTw.k;const [p0,t0,p1,t1]=camFrom;// arco: sube por el medio
  camera.position.lerpVectors(p0,p1,k);camera.position.y+=Math.sin(k*Math.PI)*2.2;controls.target.lerpVectors(t0,t1,k);if(k>=1){camTw=null}}
 controls.update();
 // luz clave orbitando muy despacio (reflejos vivos)
 const la=t*.06;key.position.set(Math.cos(la)*7,11,Math.sin(la)*5+4);key.target.position.set(0,0,0);
 rim.intensity=1+Math.sin(t*.7)*.25;
 if(dust){const a=dust.geometry.attributes.position,ph=dust.geometry.userData.ph;for(let i=0;i<a.count;i++){a.array[i*3+1]+=dt*.05*(.5+Math.sin(ph[i]+t*.3)*.5);a.array[i*3]+=Math.sin(t*.2+ph[i])*dt*.03;if(a.array[i*3+1]>5.5)a.array[i*3+1]=.3}a.needsUpdate=true}
 if(!LVL||!board)return;
 // tren de engranajes
 const inComp=ev?ev.comp:new Set();let volA=0,ancA=0;
 if(won){tickT+=dt;const f=2.5;const ph=TAU*f*tickT;volA=Math.sin(ph)*2.2;ancA=Math.tanh(Math.sin(ph)*5)*.12;
  const beat=tickT*2*f,k=Math.floor(beat),fr=beat-k;if(k!==objs.lastBeat){objs.lastBeat=k;if(k>0)sfx(k%2?'tock':'tick');if(k%2===0)FX.burst(P(LVL.anc.vp.u,LVL.anc.vp.v,.9),{count:2,color:'#ffe2b0',speed:.3,life:.6,gravity:.2})}
  const step=TAU/30*(k+Math.min(1,fr/.18)*1);const thE=escBase+LVL.dir*step;D=(thE-ev.coef.esc.b)/ev.coef.esc.a}
 else if(ev&&!ev.jam){D+=dt*(ev.connected?.25:.55)}
 const jit=ev&&ev.jam?Math.sin(t*60)*.025:0;
 const setG=(o,id)=>{if(!o)return;const c=ev&&ev.coef[id];if(c&&inComp.has(id))o.rotation.y=c.a*D+c.b+(jit?jit*(id.charCodeAt(1)%2?1:-1):0);else o.rotation.y=o.userData.phase||0};
 setG(objs.bar,'bar');setG(objs.esc,'esc');
 objs.fixed&&objs.fixed.forEach((o,i)=>setG(o,'f'+i));
 for(const i in objs.gears)setG(objs.gears[i],'p'+i);
 if(objs.vol){objs.vol.rotation.y=volA;objs.spi.rotation.y=volA;const s=1+Math.sin(volA)*.02;objs.spi.scale.set(s,1,s)}
 if(objs.anc)objs.anc.rotation.y=LVL.anc.ang+ancA;
 if(objs.cage)objs.cage.rotation.y=t*.4;
 // anillos de ejes: respiran; el de la pista, dorado
 objs.pegs.forEach((p,i)=>{if(!p.ring.visible)return;const r=p.ring.userData.ring;const hp=i===hintPeg;r.material.color.set(hp?FX.lin('#ffcf6a'):FX.lin('#3d6bff'));const s=1+Math.sin(t*3+i)*.06+(hp?Math.sin(t*8)*.1:0);r.scale.set(s,s,s);r.material.opacity=.55+Math.sin(t*3+i)*.3});
 if(objs.arrow){const m=objs.arrow.userData.mat;m.color.set(won?FX.lin('#ffcf6a'):FX.lin('#6f92ff'));m.opacity=.6+Math.sin(t*4)*.35;objs.arrow.rotation.y=won?0:Math.sin(t*2)*.08*LVL.dir}
 // luces de evento
 jamL.intensity=ev&&ev.jam?1.5+Math.sin(t*20)*1.2:0;if(ev&&ev.jam&&objs.gears){const id=ev.jamPair[0];const i=id&&id[0]==='p'?id.slice(1):null;const o=i!=null?objs.gears[i]:objs.bar;if(o)jamL.position.copy(o.position).add(new THREE.Vector3(0,1,0))}
 if(won){const e=FX.t-winAt;flash.position.copy(P(LVL.esc.u,LVL.esc.v,1.5));flash.intensity=e<1.2?Math.sin(e/1.2*Math.PI)*6:0;FX.bloom.strength=.5+(e<1.2?Math.sin(e/1.2*Math.PI)*.7:0);if(e<.05){FX.burst(P(LVL.esc.u,LVL.esc.v,.8),{count:80,color:'#ffd27a',speed:3,life:1.1,gravity:-3});FX.burst(P(LVL.anc.vp.u,LVL.anc.vp.v,1),{count:50,color:'#9fb6ff',speed:2.2,life:1,gravity:-2})}}
 // vitrina
 if(watch&&mode==='vit'){watch.rotation.y=Math.sin(t*.4)*.5;watch.position.y=2.7+Math.sin(t*1.1)*.06;const d=new Date();const [h,m,s]=watch.userData.hands;const sec=d.getSeconds()+d.getMilliseconds()/1000,min=d.getMinutes()+sec/60,hr=(d.getHours()%12)+min/60;s.rotation.y=-sec/60*TAU;m.rotation.y=-min/60*TAU;h.rotation.y=-hr/12*TAU;if(watch.userData.moon)watch.userData.moon.rotation.y=t*.05}
}

/* ---------- arranque ---------- */
FX.load(()=>{
 Object.values(FX.LIB).forEach(dequant);
 // materiales
 FX.LIB.RuedaS.traverse(m=>{if(m.isMesh&&m.material.name==='Latón')brassMats.add(m.material)});['RuedaM','RuedaL'].forEach(n=>FX.LIB[n].traverse(m=>{if(m.isMesh&&m.material.name==='Latón')brassMats.add(m.material)}));
 brassMats.forEach(m=>{m.envMapIntensity=1.3});
 bluedMat=new THREE.MeshStandardMaterial({color:FX.lin('#2a4fb8'),metalness:1,roughness:.24,envMapIntensity:1.4});
 ghostMat=new THREE.MeshBasicMaterial({color:FX.lin('#7d9bff'),transparent:true,opacity:.28,depthWrite:false});
 ghostBad=new THREE.MeshBasicMaterial({color:FX.lin('#ff3560'),transparent:true,opacity:.35,depthWrite:false});
 FX.LIB.Platina.traverse(m=>{if(m.isMesh&&m.material.name==='Rodio platina'){m.material.map=perlage();m.material.color.set(FX.lin('#a9afb8'));m.material.roughness=.42;m.material.envMapIntensity=.7;m.material.needsUpdate=true}});
 Object.values(FX.LIB).forEach(o=>o.traverse(m=>{if(m.isMesh&&m.material.name==='Rubí'){m.material.emissiveIntensity=1.6;m.material.roughness=.05}}));
 const plat=FX.get('Platina');scene.add(plat);
 const vel=new THREE.Mesh(new THREE.CircleGeometry(40,64),new THREE.MeshStandardMaterial({map:velvet(),roughness:1,metalness:0,color:0xffffff,envMapIntensity:.15}));vel.rotation.x=-Math.PI/2;vel.position.y=-.52;vel.receiveShadow=true;scene.add(vel);
 makeDust();
 FX.onResize();
 build(S.lvl);
 // intro cinematográfica: espiral descendente
 const h=homePose();camera.position.set(h.pos.x+14,h.pos.y+18,h.pos.z-10);controls.target.copy(h.tgt);camGo(h.pos,h.tgt,2.4);
 document.body.classList.add('ready');
 FX.onFrame=frame;FX.start();
});

/* API de pruebas */
window.T={solve(){Object.keys(st).forEach(i=>place(+i,null,true));for(const i in LVL.sol){place(+i,LVL.sol[i])}return ev&&ev.win},level(n){S.unl=Math.max(S.unl,n+1);S.lvl=n;build(n);return LVL.par},state(){return JSON.stringify({L:LVL&&LVL.L,st,moves,cols,won,conn:ev&&ev.connected,jam:ev&&ev.jam,dir:LVL&&LVL.dir,dirE:ev&&ev.dirE,S})},
 check(){const out=[];for(let L=0;L<LV;L++){const lv=gen(L,1+L*17);out.push(lv?[L,lv.par,lv.pegs.length,lv.fixed.length,lv.pegs.filter(p=>p.trap).length,evalState(lv,lv.sol).win,evalState(lv,{}).win]:[L,'FALLO'])}const d=gen(7,today());out.push(['día',d&&evalState(d,d.sol).win]);return JSON.stringify(out)},
 ff(s){for(let i=0;i<s*30;i++){const dt=1/30;FX.t+=dt;FX.tweens.slice().forEach(w=>{w.t+=dt;const p=Math.min(1,w.t/w.dur),e=w.ease(p);for(const k in w.to)w.obj[k]=w.from[k]+(w.to[k]-w.from[k])*e;if(p>=1){FX.tweens.splice(FX.tweens.indexOf(w),1);w.done&&w.done()}});frame(dt,FX.t)}return 'ok'},
 jam(){const i=LVL.pegs.findIndex(p=>p.trap);if(i<0)return 'sin trampa';T.solve();won=false;LVL.saved=true;LVL.tray[LVL.pegs[i].trap]++;return place(i,LVL.pegs[i].trap)+' '+T.state()},vit(i){openVit(i);return 'ok'},place(i,k){return place(i,k)}};
